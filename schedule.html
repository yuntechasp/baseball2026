<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>賽程資訊</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1a5fa8;--blue-dark:#0d3b6e;--blue-light:#e6f1fb;
  --green:#1d9e75;--accent:#e85d24;--amber:#ba7517;
  --gray-50:#f7f6f3;--gray-100:#ededea;--gray-200:#d5d4ce;
  --gray-400:#888780;--gray-700:#3d3d3a;--gray-900:#1c1c1a;
  --white:#fff;--radius:8px;--radius-lg:12px;
  --shadow:0 2px 8px rgba(0,0,0,.10);
}
body{font-family:'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  background:var(--gray-50);color:var(--gray-700);font-size:14px;line-height:1.6;min-height:100vh}

/* Nav */
.nav{background:var(--blue-dark);color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.nav-inner{max-width:1000px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px}
.nav-logo{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.nav-links{display:flex;gap:4px;align-items:center}
.nav-link{padding:6px 14px;border-radius:var(--radius);font-size:13px;font-weight:500;
  color:rgba(255,255,255,.8);text-decoration:none;transition:all .15s}
.nav-link:hover{background:rgba(255,255,255,.12);color:#fff}
.nav-link.active{background:rgba(255,255,255,.18);color:#fff}
.nav-link.cta{background:var(--accent);color:#fff}

/* Header */
.page-header{background:linear-gradient(135deg,var(--blue-dark),var(--blue));color:#fff;padding:28px 20px;text-align:center}
.page-header h1{font-size:20px;font-weight:700;margin-bottom:4px}
.page-header p{font-size:13px;opacity:.8}

/* Main */
.main{max-width:1000px;margin:0 auto;padding:28px 16px 60px}

/* Loading */
.loading{text-align:center;padding:48px;color:var(--gray-400)}
.spinner{display:inline-block;width:30px;height:30px;border:3px solid var(--gray-100);
  border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Status tag */
.status-tag{display:inline-block;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:20px}
.st-open{background:#fff0e6;color:var(--accent);border:1px solid #fcd5bd}
.st-done{background:#eaf3de;color:#3b6d11;border:1px solid #c0dd97}
.st-closed{background:var(--gray-100);color:var(--gray-400);border:1px solid var(--gray-200)}

/* Group section */
.group-section{margin-bottom:40px}
.group-label{font-size:16px;font-weight:700;color:var(--blue-dark);
  display:flex;align-items:center;gap:8px;margin-bottom:16px;
  padding-bottom:10px;border-bottom:2px solid var(--gray-100)}

/* ── 循環賽方塊圖 ── */
.bracket-box{background:var(--white);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.bracket-svg-wrap{position:relative;width:100%;max-width:500px;margin:0 auto;padding:16px}

/* ── 對戰時間表 ── */
.match-table-wrap{overflow-x:auto}
.match-table{width:100%;border-collapse:collapse}
.match-table th{background:var(--blue-dark);color:#fff;padding:9px 12px;font-size:12px;text-align:left}
.match-table td{padding:9px 12px;border-bottom:1px solid var(--gray-100);font-size:13px}
.match-table tr:last-child td{border-bottom:none}
.match-table tr:hover td{background:var(--gray-50)}
.match-table tr.done-row td{background:#f0fff4}
.score-cell{font-weight:700;color:var(--blue-dark);font-size:15px;text-align:center}
.win-team{color:var(--green);font-weight:700}
.vs-tag{display:inline-block;background:var(--gray-100);color:var(--gray-400);
  border-radius:4px;padding:2px 6px;font-size:11px;font-weight:700}
.pending-tag{color:var(--gray-400);font-size:12px}

/* Footer */
.footer{background:var(--blue-dark);color:rgba(255,255,255,.6);text-align:center;padding:20px;font-size:12px}

@media(max-width:600px){
  .nav-links .nav-link:not(.cta):not(.home){display:none}
  .bracket-svg-wrap{padding:8px}
}
</style>
</head>
<body>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwnfhLHpto7inivZqYmNVo0moc322x0N3igfZqWBA-qNiAdLalNOoxjDzl5Go3GJYix/exec';
</script>

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-logo">⚾ <span id="nav-title">比賽報名系統</span></div>
    <div class="nav-links">
      <a class="nav-link home" href="index.html">🏠 首頁</a>
      <a class="nav-link" href="index.html#news">最新消息</a>
      <a class="nav-link" href="index.html#rules">競賽規程</a>
      <a class="nav-link active" href="schedule.html">賽程資訊</a>
      <a class="nav-link" href="index.html#stats">報名統計</a>
      <a class="nav-link cta" href="register.html">✏️ 立即報名</a>
    </div>
  </div>
</nav>

<div class="page-header">
  <h1 id="page-title">賽程資訊</h1>
  <p id="page-sub"></p>
</div>

<div class="main">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div>載入賽程資訊中…</div>
  </div>
  <div id="content" style="display:none">
    <div style="text-align:center;margin-bottom:24px">
      <span class="status-tag" id="draw-status-tag">載入中</span>
    </div>
    <div id="groups-area"></div>
  </div>
</div>

<div class="footer">
  <div id="footer-title"></div>
  <div style="margin-top:6px;font-size:11px">雲科大體育室 · 蔡小姐 · 05-5342601#2704 · wanjan@yuntech.edu.tw</div>
</div>

<script>
let settings = {}, drawData = [], matchData = [], approvedTeams = [];
let groupCount = 4, approvedCount = 0;

async function api(params) {
  const r = await fetch(API_URL + '?' + new URLSearchParams(params));
  return r.json();
}

(async () => {
  try {
    const [allRes, drawRes, matchRes] = await Promise.all([
      api({ action:'getAllData' }),
      api({ action:'getDrawData' }),
      api({ action:'getMatches' }),
    ]);
    if (allRes.ok) {
      settings      = allRes.settings || {};
      approvedTeams = (allRes.teams || []).filter(t => t.status === 'approved');
    }
    if (drawRes.ok) {
      drawData      = drawRes.draws || [];
      groupCount    = drawRes.groupCount || 4;
      approvedCount = drawRes.approvedCount || approvedTeams.length;
    }
    if (matchRes.ok && matchRes.data) {
      matchData = matchRes.data;
    }
  } catch(e) { console.error(e); }

  applySettings();
  render();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
})();

function applySettings() {
  const title = settings.title || '比賽賽程';
  document.title = title + ' — 賽程資訊';
  document.getElementById('nav-title').textContent   = title;
  document.getElementById('page-title').textContent  = '賽程資訊';
  document.getElementById('page-sub').textContent    = (settings.subtitle||'') + (settings.venue ? '  ·  ' + settings.venue : '');
  document.getElementById('footer-title').textContent = title;
}

function render() {
  const tag = document.getElementById('draw-status-tag');
  const done = drawData.length >= approvedCount && approvedCount > 0;
  const open = settings.drawOpen === 'true';

  if (done) {
    tag.className = 'status-tag st-done'; tag.textContent = '✅ 抽籤已完成';
  } else if (open) {
    tag.className = 'status-tag st-open'; tag.textContent = '🎰 抽籤進行中（' + drawData.length + ' / ' + approvedCount + ' 隊）';
  } else {
    tag.className = 'status-tag st-closed'; tag.textContent = '⏳ 抽籤尚未開放';
  }

  const n = approvedCount;
  if (!n && !open) {
    document.getElementById('groups-area').innerHTML =
      '<div style="text-align:center;padding:48px;color:var(--gray-400)">賽程尚未公布，請待抽籤完成後查看。</div>';
    return;
  }

  // Build slot map
  const slotMap = {};
  drawData.forEach(d => { slotMap[d.slot] = d.teamname; });

  // Build groups
  const base  = Math.floor(n / groupCount);
  const extra = n % groupCount;
  const groupLabels = ['A','B','C','D','E','F'];
  let groups = [], slotStart = 1;
  for (let g = 0; g < groupCount; g++) {
    const size = base + (g < extra ? 1 : 0);
    const slots = [];
    for (let s = slotStart; s < slotStart + size; s++) {
      slots.push({ slot: s, teamname: slotMap[s] || null });
    }
    groups.push({ label: groupLabels[g], slots });
    slotStart += size;
  }

  const area = document.getElementById('groups-area');
  area.innerHTML = groups.map(g => renderGroup(g)).join('');
}

function renderGroup(group) {
  const slots = group.slots;
  const n = slots.length;

  // Build match list for this group
  const groupMatches = matchData.filter(m => m.phase && m.phase.includes(group.label + '組'));

  let html = '<div class="group-section">';
  html += '<div class="group-label">⚾ ' + group.label + ' 組';
  html += ' <span style="font-size:12px;font-weight:400;color:var(--gray-400)">（' + n + ' 隊循環賽）</span></div>';

  // SVG bracket diagram
  html += '<div class="bracket-box"><div class="bracket-svg-wrap">';
  html += buildSVG(group, groupMatches);
  html += '</div></div>';

  // Match table
  if (groupMatches.length) {
    html += '<div class="match-table-wrap"><table class="match-table"><thead><tr>' +
      '<th style="width:55px">場次</th>' +
      '<th>隊伍 A</th>' +
      '<th style="width:100px;text-align:center">比分</th>' +
      '<th>隊伍 B</th>' +
      '<th style="width:80px">日期</th>' +
      '<th style="width:65px">時間</th>' +
      '<th style="width:50px">場地</th>' +
      '</tr></thead><tbody>';

    groupMatches.forEach(m => {
      const hasScore = m.scoreA !== undefined && m.scoreA !== '' && m.scoreB !== undefined && m.scoreB !== '';
      const isWinA = hasScore && Number(m.scoreA) > Number(m.scoreB);
      const isWinB = hasScore && Number(m.scoreB) > Number(m.scoreA);
      const scoreCell = hasScore
        ? '<span class="score-cell">' + m.scoreA + ' : ' + m.scoreB + '</span>' +
          (m.winner && m.winner !== '平局'
            ? '<br><span style="font-size:11px;color:var(--green)">✅ ' + esc(m.winner) + '</span>'
            : '<br><span style="font-size:11px;color:var(--gray-400)">平局</span>')
        : '<span class="pending-tag">待賽</span>';

      html += '<tr class="' + (hasScore ? 'done-row' : '') + '">' +
        '<td><strong>' + esc(m.matchNum) + '</strong></td>' +
        '<td class="' + (isWinA ? 'win-team' : '') + '">' + esc(m.teamA) + '</td>' +
        '<td style="text-align:center">' + scoreCell + '</td>' +
        '<td class="' + (isWinB ? 'win-team' : '') + '">' + esc(m.teamB) + '</td>' +
        '<td>' + fmtDate(m.date) + '</td>' +
        '<td>' + esc(m.time) + '</td>' +
        '<td>' + esc(m.court) + '</td>' +
        '</tr>';
    });
    html += '</tbody></table></div>';
  }

  html += '</div>';
  return html;
}

// ── 繪製循環賽 SVG 方塊圖 ──
function buildSVG(group, matches) {
  const slots = group.slots;
  const n = slots.length;
  const size = 380;
  const pad  = 70;
  const inner = size - pad * 2;
  const cx = size / 2, cy = size / 2;

  // Team positions (corners + sides depending on team count)
  let positions = [];
  if (n === 3) {
    positions = [
      { x: cx,      y: pad-20,       anchor: 'middle', baseline: 'auto'   }, // top
      { x: pad-10,  y: size-pad+20,  anchor: 'end',    baseline: 'auto'   }, // bottom-left
      { x: size-pad+10, y: size-pad+20, anchor: 'start', baseline: 'auto' }, // bottom-right
    ];
  } else {
    // 4 corners
    positions = [
      { x: pad,      y: pad,      anchor: 'middle', baseline: 'auto'   }, // TL
      { x: size-pad, y: pad,      anchor: 'middle', baseline: 'auto'   }, // TR
      { x: size-pad, y: size-pad, anchor: 'middle', baseline: 'auto'   }, // BR
      { x: pad,      y: size-pad, anchor: 'middle', baseline: 'auto'   }, // BL
    ];
    if (n > 4) {
      // Add side positions for 5
      positions.push({ x: cx, y: pad-20, anchor: 'middle', baseline: 'auto' });
    }
  }

  // Compute match midpoints for labels
  const matchLabels = [];
  let mIdx = 0;
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const pi = positions[i] || { x: cx, y: cy };
      const pj = positions[j] || { x: cx, y: cy };
      const mx = (pi.x + pj.x) / 2;
      const my = (pi.y + pj.y) / 2;
      const match = matches[mIdx] || null;
      matchLabels.push({ mx, my, match, i, j });
      mIdx++;
    }
  }

  let svg = '<svg viewBox="0 0 ' + size + ' ' + size + '" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:440px;display:block;margin:0 auto">';

  // Background
  svg += '<rect width="' + size + '" height="' + size + '" fill="#f7f6f3" rx="12"/>';

  // Draw lines between all pairs
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const pi = positions[i] || { x: cx, y: cy };
      const pj = positions[j] || { x: cx, y: cy };
      svg += '<line x1="' + pi.x + '" y1="' + pi.y + '" x2="' + pj.x + '" y2="' + pj.y + '" stroke="#d5d4ce" stroke-width="1.5" stroke-dasharray="4,3"/>';
    }
  }

  // Draw match labels at midpoints
  matchLabels.forEach(({ mx, my, match }) => {
    const hasScore = match && match.scoreA !== undefined && match.scoreA !== '' && match.scoreB !== undefined && match.scoreB !== '';
    const bgColor  = hasScore ? '#eaf3de' : '#fff';
    const border   = hasScore ? '#c0dd97' : '#d5d4ce';

    svg += '<rect x="' + (mx-28) + '" y="' + (my-22) + '" width="56" height="44" rx="6" fill="' + bgColor + '" stroke="' + border + '" stroke-width="1"/>';

    if (match) {
      svg += '<text x="' + mx + '" y="' + (my-8) + '" text-anchor="middle" font-size="11" font-weight="700" fill="#1a5fa8">' + esc(match.matchNum) + '</text>';
      if (hasScore) {
        svg += '<text x="' + mx + '" y="' + (my+6) + '" text-anchor="middle" font-size="11" font-weight="700" fill="#1d9e75">' + match.scoreA + ':' + match.scoreB + '</text>';
      } else {
        svg += '<text x="' + mx + '" y="' + (my+5) + '" text-anchor="middle" font-size="10" fill="#888">' + fmtDate(match.date) + '</text>';
        svg += '<text x="' + mx + '" y="' + (my+17) + '" text-anchor="middle" font-size="10" fill="#888">' + (match.time || '') + '</text>';
      }
    } else {
      svg += '<text x="' + mx + '" y="' + (my+4) + '" text-anchor="middle" font-size="10" fill="#aaa">待定</text>';
    }
  });

  // Draw team name boxes
  slots.forEach((slot, i) => {
    const pos = positions[i] || { x: cx, y: cy };
    const name = slot.teamname || ('第' + slot.slot + '籤');
    const isEmpty = !slot.teamname;
    const bgColor = isEmpty ? '#ededea' : '#e6f1fb';
    const textColor = isEmpty ? '#888780' : '#0d3b6e';
    const borderColor = isEmpty ? '#d5d4ce' : '#1a5fa8';

    // Truncate long names
    const displayName = name.length > 6 ? name.slice(0, 6) + '…' : name;

    svg += '<rect x="' + (pos.x-42) + '" y="' + (pos.y-20) + '" width="84" height="40" rx="8" fill="' + bgColor + '" stroke="' + borderColor + '" stroke-width="1.5"/>';
    svg += '<text x="' + pos.x + '" y="' + (pos.y-4) + '" text-anchor="middle" font-size="11" fill="#888">T' + (i+1) + '</text>';
    svg += '<text x="' + pos.x + '" y="' + (pos.y+12) + '" text-anchor="middle" font-size="12" font-weight="700" fill="' + textColor + '">' + esc(displayName) + '</text>';
  });

  svg += '</svg>';
  return svg;
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(d) {
  if (!d) return '';
  // Convert ISO string to M/D
  if (String(d).includes('T') || String(d).includes('-')) {
    const dt = new Date(d);
    if (!isNaN(dt)) return (dt.getMonth()+1) + '/' + dt.getDate();
  }
  return String(d);
}
</script>
</body>
</html>
