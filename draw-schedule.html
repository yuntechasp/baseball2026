<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>線上抽籤 & 賽程資訊</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --yt-teal:#00A88F;--yt-teal-dark:#00695C;--yt-teal-mid:#00876f;
  --yt-teal-light:#E0F5F2;--yt-teal-border:#9FD9CE;
  --yt-orange:#F47920;--yt-orange-light:#FEF0E6;--yt-orange-border:#FBCFA4;
  --blue:#00A88F;--blue-dark:#00695C;--blue-light:#E0F5F2;
  --green:#1d9e75;--accent:#F47920;--amber:#ba7517;
  --gray-50:#f7f6f3;--gray-100:#ededea;--gray-200:#d5d4ce;
  --gray-400:#888780;--gray-600:#5f5e5a;--gray-700:#3d3d3a;--gray-900:#1c1c1a;
  --white:#fff;--radius:8px;--radius-lg:12px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.07);--shadow:0 2px 8px rgba(0,0,0,.10);
}
body{font-family:'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  background:linear-gradient(180deg,#eef8f5 0%,#e3f3ef 30%,#eaf6f2 70%,#f2f8f5 100%);
  background-attachment:fixed;
  color:var(--gray-700);font-size:14px;line-height:1.7;min-height:100vh}

/* ── Nav ── */
.nav{background:var(--yt-teal-dark);color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.nav-inner{max-width:1000px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px}
.nav-logo{font-size:14px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.nav-links{display:flex;gap:4px}
.nav-link{padding:6px 14px;border-radius:var(--radius);font-size:13px;font-weight:500;
  color:rgba(255,255,255,.8);cursor:pointer;border:none;background:none;
  text-decoration:none;transition:all .15s;font-family:inherit}
.nav-link:hover{background:rgba(255,255,255,.12);color:#fff}
.nav-link.active{background:rgba(255,255,255,.18);color:#fff}
.nav-link.cta{background:var(--yt-orange);color:#fff;margin-left:8px;font-weight:600}
.nav-link.cta:hover{background:#c4601a}

/* ── Tab Bar ── */
.tab-bar{background:var(--white);border-bottom:2px solid var(--gray-100);
  position:sticky;top:52px;z-index:90;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.tab-bar-inner{max-width:1000px;margin:0 auto;display:flex}
.tab-btn{flex:1;padding:14px 10px;font-size:14px;font-weight:600;cursor:pointer;
  border:none;background:none;color:var(--gray-400);border-bottom:3px solid transparent;
  margin-bottom:-2px;transition:all .15s;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px}
.tab-btn:hover{color:var(--gray-700);background:var(--gray-50)}
.tab-btn.active{color:var(--yt-teal);border-bottom-color:var(--yt-teal)}
.tab-badge{background:var(--yt-orange);color:#fff;border-radius:10px;
  font-size:10px;font-weight:700;padding:1px 7px}

/* ── Hero ── */
.site-banner{width:100%;overflow:hidden;line-height:0;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.site-banner img{display:block;width:100%;height:auto}
.page-hero{background:linear-gradient(135deg,var(--yt-teal-dark) 0%,var(--yt-teal) 60%,#00BFA5 100%);
  color:#fff;padding:28px 20px 24px;text-align:center}
.page-hero h1{font-size:20px;font-weight:700;margin-bottom:4px}
.page-hero p{font-size:13px;opacity:.8}

/* ── Main ── */
.main{max-width:1000px;margin:0 auto;padding:28px 20px 60px}
.tab-panel{display:none}.tab-panel.active{display:block}

/* ── Section ── */
.section{margin-bottom:32px}
.section-title{font-size:17px;font-weight:700;color:var(--gray-900);
  display:flex;align-items:center;gap:8px;margin-bottom:16px;
  padding-bottom:10px;border-bottom:2px solid var(--yt-teal-light)}

/* ── Card ── */
.card{background:var(--white);border-radius:var(--radius-lg);
  border:1px solid var(--gray-100);box-shadow:var(--shadow-sm);overflow:hidden}
.card-body{padding:20px}

/* ── 抽籤 ── */
.verify-box{background:var(--gray-50);border:1px solid var(--gray-100);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px}
.verify-title{font-size:13px;font-weight:700;color:var(--gray-700);margin-bottom:12px}
.verify-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media(max-width:500px){.verify-grid{grid-template-columns:1fr}}
.verify-input{width:100%;padding:9px 11px;border:1px solid var(--gray-200);
  border-radius:var(--radius);font-size:13px;font-family:inherit;transition:border .15s}
.verify-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,168,143,.1)}
.verify-btn{padding:10px 20px;background:var(--blue);color:#fff;border:none;
  border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;width:100%}
.verify-btn:hover{background:var(--blue-dark)}
.verify-err{font-size:12px;color:#a32d2d;margin-top:6px;display:none}
.verify-err.show{display:block}
.draw-display{background:var(--gray-50);border:1.5px solid var(--gray-200);
  border-radius:var(--radius-lg);padding:20px;text-align:center;
  min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:14px 0}
.draw-num{font-size:48px;font-weight:900;color:var(--blue);line-height:1}
.draw-team-label{font-size:14px;font-weight:600;color:var(--gray-700);margin-bottom:6px}
.draw-hint{font-size:13px;color:var(--gray-400)}
@keyframes numFlash{0%{opacity:.3;transform:translateY(-3px)}100%{opacity:1;transform:translateY(0)}}
.num-flash{animation:numFlash .08s ease-out}
.draw-done-all{background:#eaf3de;border:1px solid #c0dd97;border-radius:var(--radius);
  padding:12px 16px;text-align:center;font-size:13px;font-weight:500;color:#3b6d11;margin-bottom:14px}

/* ── 對戰圖 ── */
.bracket-title{font-size:13px;font-weight:700;color:var(--yt-teal-dark);
  padding:8px 14px;background:var(--yt-teal-light);border-radius:var(--radius) var(--radius) 0 0;
  border:1px solid var(--yt-teal-border);border-bottom:none}
.bracket-grid{border:1px solid var(--gray-200);border-radius:0 0 var(--radius) var(--radius);overflow:hidden}
.bracket-row{display:grid;grid-template-columns:80px 1fr 60px;border-bottom:1px solid var(--gray-100)}
.bracket-row:last-child{border-bottom:none}
.bracket-row:hover{background:var(--gray-50)}
.bracket-cell{padding:10px;font-size:13px;display:flex;align-items:center}
.bracket-cell.header{background:var(--blue-dark);color:#fff;font-size:11px;font-weight:700;padding:8px 10px}
.bracket-slot{font-weight:600;color:var(--blue-dark)}
.bracket-slot.empty{color:var(--gray-200);font-style:italic;font-weight:400}
.bracket-num{font-size:11px;color:var(--gray-400);background:var(--gray-100);
  border-radius:4px;padding:2px 6px;font-weight:600}

/* ── 賽程表 ── */
.group-title{font-size:14px;font-weight:700;color:var(--yt-teal-dark);
  padding:10px 16px;background:var(--yt-teal-light);border-radius:var(--radius) var(--radius) 0 0;
  border:1px solid var(--yt-teal-border)}
.match-table{width:100%;border-collapse:collapse}
.match-table th{background:var(--yt-teal-dark);color:#fff;padding:9px 12px;font-size:12px;text-align:left}
.match-table td{padding:9px 12px;border-bottom:1px solid var(--gray-100);font-size:13px}
.match-table tr:last-child td{border-bottom:none}
.match-table tr:hover td{background:var(--gray-50)}
.schedule-wrap{overflow-x:auto;border:1px solid var(--gray-100);border-radius:var(--radius-lg);margin-bottom:16px}

/* ── schedule.html 的 SVG 賽程 ── */
.group-section{margin-bottom:40px}
.group-label{font-size:16px;font-weight:700;color:var(--yt-teal-dark);
  display:flex;align-items:center;gap:8px;margin-bottom:16px;
  padding-bottom:10px;border-bottom:2px solid var(--yt-teal-light)}
.bracket-box{background:var(--white);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.bracket-svg-wrap{position:relative;width:100%;max-width:500px;margin:0 auto;padding:16px}
.match-table-wrap{overflow-x:auto}
.status-tag{display:inline-block;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:20px}
.st-open{background:var(--yt-orange-light);color:#c4601a;border:1px solid var(--yt-orange-border)}
.st-done{background:var(--yt-teal-light);color:var(--yt-teal-dark);border:1px solid var(--yt-teal-border)}
.st-closed{background:var(--gray-100);color:var(--gray-400);border:1px solid var(--gray-200)}
.win-team{color:var(--green);font-weight:700}
.score-cell{font-weight:700;color:var(--blue-dark);font-size:15px;text-align:center}
.pending-tag{color:var(--gray-400);font-size:12px}

/* ── 賽程圖 ── */
.bracket-section{margin-bottom:32px}
.bracket-section-title{font-size:15px;font-weight:700;color:var(--yt-teal-dark);
  display:flex;align-items:center;gap:8px;margin-bottom:16px;
  padding-bottom:8px;border-bottom:2px solid var(--yt-teal-light)}
.groups-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:640px){.groups-row{grid-template-columns:1fr}}
.group-box{background:var(--white);border:1.5px solid var(--yt-teal-border);
  border-radius:var(--radius-lg);overflow:hidden}
.group-box-title{background:var(--yt-teal-dark);color:#fff;font-size:13px;font-weight:700;
  padding:8px 14px;display:flex;align-items:center;gap:6px}
.group-svg-wrap{padding:12px;display:flex;justify-content:center}
.elim-box{background:var(--white);border:1.5px solid var(--yt-teal-border);
  border-radius:var(--radius-lg);overflow:hidden;margin-bottom:16px}
.elim-box-title{background:var(--yt-teal-dark);color:#fff;font-size:13px;font-weight:700;padding:8px 14px}
.elim-svg-wrap{padding:16px;display:flex;justify-content:center;overflow-x:auto}

/* ── Loading ── */
.loading{text-align:center;padding:40px;color:var(--gray-400)}
.spinner{display:inline-block;width:28px;height:28px;border:2px solid var(--gray-200);
  border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Toast ── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--gray-900);color:#fff;
  padding:10px 16px;border-radius:var(--radius-lg);font-size:13px;
  box-shadow:0 4px 16px rgba(0,0,0,.25);transform:translateY(60px);opacity:0;
  transition:all .3s;pointer-events:none;z-index:999}
.toast.show{transform:translateY(0);opacity:1}

/* ── 賽程分組頁籤 ── */
.grp-tab-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.grp-tab-btn{padding:10px 24px;border:2px solid var(--yt-teal-border);background:var(--white);
  border-radius:var(--radius-lg);font-size:14px;font-weight:600;cursor:pointer;
  color:var(--gray-600);font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:4px}
.grp-tab-btn:hover{border-color:var(--yt-teal);color:var(--yt-teal);background:var(--yt-teal-light)}
.grp-tab-btn.active{background:var(--yt-teal-dark);color:#fff;border-color:var(--yt-teal-dark)}
.grp-tab-btn.active span{background:rgba(255,255,255,.3)!important;color:#fff!important}

/* ── Footer ── */
.footer{background:var(--yt-teal-dark);color:rgba(255,255,255,.6);text-align:center;padding:20px;font-size:12px}
.footer a{color:rgba(255,255,255,.8);text-decoration:none}

/* ── 隊徽 ── */
.tlogo{width:22px;height:22px;border-radius:6px;object-fit:contain;vertical-align:middle;background:transparent;border:none;flex-shrink:0}
.tlogo-fb{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#fff;vertical-align:middle;flex-shrink:0}
/* ── 賽事詳情彈窗 ── */
.gm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
.gm-overlay.open{display:flex}
.gm-panel{background:var(--white);border-radius:16px;max-width:700px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25);overflow:hidden;margin:auto 0}
.gm-head{background:var(--yt-teal-dark);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.gm-head .m{font-size:13px;font-weight:700}
.gm-close{background:rgba(255,255,255,.15);border:none;color:#fff;width:28px;height:28px;border-radius:50%;font-size:16px;cursor:pointer;line-height:1}
.gm-score{display:flex;align-items:center;justify-content:center;gap:22px;padding:18px 16px 8px}
.gm-team{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:110px}
.gm-team .n{font-size:16px;font-weight:700;color:var(--gray-900);text-align:center}
.gm-team .tlogo,.gm-team .tlogo-fb{width:64px;height:64px;font-size:22px}
.gm-big{font-size:44px;font-weight:800;color:var(--gray-900);display:flex;align-items:center;gap:14px}
.gm-big .win{color:var(--yt-teal-dark)}
.gm-status{text-align:center;font-size:13px;font-weight:700;color:var(--gray-400);letter-spacing:.06em;padding-bottom:8px}
.gm-sec{padding:8px 18px 16px}
.gm-sec-title{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--gray-400);margin:8px 0 8px}
.gm-pit{display:flex;gap:10px;flex-wrap:wrap}
.gm-pit-card{flex:1;min-width:160px;border:1px solid var(--gray-100);border-radius:10px;padding:10px 12px;background:var(--gray-50)}
.gm-pit-name{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--gray-900);margin-bottom:8px}
.gm-tag{font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;color:#fff;letter-spacing:.05em}
.gm-tag.w{background:var(--yt-teal-dark)}.gm-tag.l{background:#c0392b}.gm-tag.sv{background:#c4601a}
.gm-pit-stats{display:flex;gap:12px}
.gm-pit-stat{text-align:center}
.gm-pit-stat .v{font-size:19px;font-weight:800;color:var(--gray-900)}
.gm-pit-stat .k{font-size:11px;color:var(--gray-400);white-space:nowrap}
/* ── 先發名單 ── */
.gm-lineup{display:flex;gap:14px}
.gm-lineup-col{flex:1;min-width:0;border:1px solid var(--gray-100);border-radius:10px;background:var(--gray-50);padding:10px 12px}
.gm-lineup-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--gray-900);margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--gray-100)}
.gm-lineup-head .tlogo,.gm-lineup-head .tlogo-fb{width:22px;height:22px;font-size:11px}
.gm-lu-row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px;color:var(--gray-900)}
.gm-lu-num{width:18px;height:18px;border-radius:50%;background:var(--yt-teal-light);color:var(--yt-teal-dark);font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.gm-lu-pos{font-size:10px;color:var(--gray-400);margin-left:auto}
.gm-lu-row.sub{padding-left:26px;position:relative;color:var(--gray-900)}
.gm-lu-row.sub::before{content:'↳';position:absolute;left:8px;color:var(--gray-300);font-size:12px}
.gm-lu-subtag{font-size:9px;font-weight:800;padding:1px 6px;border-radius:4px;background:#fdf0e6;color:#c4601a;flex-shrink:0}
@media(max-width:520px){.gm-lineup{flex-direction:column}}
/* ── 投手運用 ── */
.gm-role{font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;color:#fff;letter-spacing:.03em;flex-shrink:0}
.gm-role.sp{background:var(--yt-teal-dark)}.gm-role.mr{background:#1a5fa8}.gm-role.cl{background:#c4601a}.gm-role.xx{background:#888}
.gm-pu-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;color:var(--gray-900)}
.gm-pu-stats{margin-left:auto;font-size:11px;color:var(--gray-400);white-space:nowrap}
/* ── 比數卡捲動箭頭 ── */
.strip-wrap{position:relative}
.strip-btn{position:absolute;top:50%;transform:translateY(-60%);z-index:5;width:32px;height:32px;border-radius:50%;
  border:1px solid var(--gray-200);background:var(--white);color:var(--yt-teal-dark);font-size:18px;font-weight:700;
  cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12);display:none;align-items:center;justify-content:center;line-height:1}
.strip-btn:hover{background:var(--yt-teal-light)}
.score-card .tlogo,.score-card .tlogo-fb{width:56px;height:56px;font-size:20px}
.strip-btn.left{left:-8px}
.strip-btn.right{right:-8px}
/* ── 比數卡 ── */
.score-strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 14px;-webkit-overflow-scrolling:touch}
.score-card{flex:0 0 calc(25% - 8px);min-width:236px;background:var(--white);border:1px solid var(--gray-200);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow-sm);box-sizing:border-box}
.score-card-status{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--gray-400);margin-bottom:9px;display:flex;justify-content:space-between;gap:8px}
.score-card-status .final{color:var(--yt-teal-dark)}
.score-card-status .live{color:#c0392b;animation:livePulse 1.6s ease-in-out infinite}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.45}}
.score-card-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;font-size:15px}
.score-card-row .t{font-weight:700;color:var(--gray-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.score-card-row .s{font-weight:800;font-size:22px;color:var(--gray-900)}
.score-card-row.winner .t,.score-card-row.winner .s{color:var(--yt-teal-dark)}
/* ── 逐局計分板 ── */
.linescore-wrap{background:var(--gray-50);border-radius:8px;padding:10px 12px;margin:4px 0}
.linescore{border-collapse:collapse;width:auto;margin:0 auto}
.linescore th,.linescore td{padding:5px 10px;text-align:center;font-size:14px;border:none}
.linescore th{color:var(--gray-400);font-weight:600;font-size:11px}
.linescore td.tname{text-align:left;font-weight:700;color:var(--gray-900);padding-right:14px;white-space:nowrap}
.linescore td.rhe{font-weight:800;color:var(--yt-teal-dark);border-left:2px solid var(--gray-200)}
.linescore td.rhe~td.rhe{border-left:none}
.ls-btn{display:inline-block;margin-top:3px;padding:2px 8px;font-size:10px;font-weight:600;color:var(--yt-teal-dark);background:var(--yt-teal-light);border:1px solid var(--yt-teal-border);border-radius:10px;cursor:pointer}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;margin-left:8px}
.hamburger span{display:block;width:22px;height:2px;background:#fff;border-radius:2px;transition:all .2s}
@media(max-width:640px){
  .nav-links .nav-link:not(.cta):not(.home){display:none}
  .nav-logo{min-width:0}
  .nav-link.home,.nav-link.cta{padding:6px 10px;white-space:nowrap;flex-shrink:0}
  .nav-links{flex-shrink:0}
  .nav-links.open{
    display:flex;position:fixed;top:52px;left:0;right:0;background:#00695C;
    flex-direction:column;padding:8px 0;gap:0;z-index:999;
    box-shadow:0 4px 12px rgba(0,0,0,.2)
  }
  .nav-links.open .nav-link{
    display:flex;padding:13px 20px;border-radius:0;
    border-bottom:1px solid rgba(255,255,255,.1)
  }
  .nav-links.open .nav-link.cta{margin-left:0}
  .hamburger{display:flex}
  .tab-btn{font-size:13px;padding:12px 8px}
}
</style>
</head>
<body>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzl_saJNrccY6hxzmBqrpKqT9gMboDs3_l0_pfattRc-7pmcQ1MVtIJpz_ijClORWs/exec';
</script>

<!-- Nav -->

<script>
// ── State ──
let settings = {}, drawData = [], matchData = [], approvedTeams = [];
let drawState = { spinning:false, open:false, done:false, approvedCount:0, groupCount:4 };
let verifiedTeam = null;
let spinTimer = null;
let groupCount = 4, approvedCount = 0;

async function api(params) {
  const r = await fetch(API_URL + '?' + new URLSearchParams(params));
  return r.json();
}

// ── 初始化 ──
(async () => {
  try {
    const [allRes, drawRes, matchRes] = await Promise.all([
      api({ action:'getPublicData' }),
      api({ action:'getDrawData' }),
      api({ action:'getMatches' }),
    ]);
    if (allRes.ok) {
      settings      = allRes.settings || {};
      approvedTeams = (allRes.teams||[]).filter(t=>t.status==='approved');
      applySettings();
    }
    if (drawRes.ok) {
      drawData              = drawRes.draws || [];
      drawState.approvedCount = drawRes.approvedCount || approvedTeams.length;
      drawState.groupCount  = drawRes.groupCount || 4;
      groupCount            = drawState.groupCount;
      approvedCount         = drawState.approvedCount;
      // drawOpen 由前端時間判斷，不依賴後端設定
      drawState.open = getDrawPhase() === 'open';
      drawState.done = drawData.length > 0 && drawData.length >= drawState.approvedCount && drawState.approvedCount > 0;
    }
    if (matchRes.ok && matchRes.data) {
      matchData = matchRes.data;
    } else if (drawRes.ok && drawRes.matches) {
      matchData = drawRes.matches;
    }
    if ((drawState.open || drawState.done) && !matchData.length && drawState.approvedCount > 0) {
      buildMatches();
    }
  } catch(e) { console.error(e); }

  document.getElementById('loading-main').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';
  renderDraw();
  renderScheduleTab(); // 總時間表

  // 若 URL 帶 #schedule 則切到總時間表
  if (location.hash === '#schedule') switchTab('schedule');
  else if (location.hash === '#bracket') switchTab('bracket');
})();

// ── 從 Sheets 時間欄位取出 HH:MM ──
// Sheets 時間欄位傳回格式可能是 "09:00"、"9:00" 或 "Sat Dec 30 1899 09:00:00 GMT+0800"
function parseSheetTime(val) {
  if (!val) return null;
  const s = String(val).trim();
  // 已是 HH:MM 格式
  const hhmm = s.match(/^(\d{1,2}):(\d{2})/);
  if (hhmm) return String(hhmm[1]).padStart(2,'0') + ':' + hhmm[2];
  // Date 字串格式（Sheets 時間欄位）：取 HH:MM 部分
  const d = new Date(s);
  if (!isNaN(d)) {
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  return null;
}

function applySettings() {
  const s = settings;
  const title = s.title || '比賽報名系統';
  document.getElementById('nav-title').textContent    = title;
  document.getElementById('footer-title').textContent = title;
  // 頁面中央大標題改為活動名稱（與首頁一致），副標保留頁面用途
  const pageTitleEl = document.getElementById('page-title');
  if (pageTitleEl) pageTitleEl.textContent = title;
  const pageSubEl = document.getElementById('page-sub');
  if (pageSubEl) pageSubEl.textContent = '線上抽籤 & 賽程資訊';
  document.title = title;

  // 報名截止後隱藏「立即報名」按鈕
  let isOpen = s.open !== 'false';
  if (isOpen && s.deadline) {
    const dlTime = parseSheetTime(s.deadlinetime);
    const deadlineStr = String(s.deadline).slice(0,10) + 'T' + (dlTime ? dlTime + ':00' : '23:59:59');
    if (new Date(deadlineStr) < new Date()) isOpen = false;
  }
  if (!isOpen) {
    document.querySelectorAll('.nav-link.cta').forEach(el => el.style.display = 'none');
  }

  // 從 Sheets 讀抽籤時間顯示
  const drawDate    = s.drawdate    || '';
  const drawTime    = parseSheetTime(s.drawtime)    || '09:00';
  const drawEndTime = parseSheetTime(s.drawendtime) || '12:00';
  if (drawDate) {
    const d = new Date(String(drawDate).slice(0,10));
    const rokYear = d.getFullYear() - 1911;
    const mo  = d.getMonth() + 1;
    const day = d.getDate();
    document.getElementById('page-sub').textContent =
      '線上抽籤時間：民國' + rokYear + '年' + mo + '月' + day + '日 ' + drawTime + ' 至 ' + drawEndTime;
  } else {
    document.getElementById('page-sub').textContent = '線上抽籤時間：請待主辦單位公告';
  }
}

// ── Tab 切換 ──
function switchTab(tab) {
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.getElementById('tab-'+tab+'-btn').classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
  if (tab === 'bracket') setTimeout(renderBracketTab, 50);
  if (tab === 'schedule') renderTotalSchedule();
}

// ════════════════════════════════
// DRAW
// ════════════════════════════════
// ── 抽籤時間從 settings 動態取得 ──
function getDrawTimes() {
  const s = settings;
  const dateStr     = String(s.drawdate || '').slice(0,10);
  const drawTime    = parseSheetTime(s.drawtime)    || '09:00';
  const drawEndTime = parseSheetTime(s.drawendtime) || '12:00';
  if (!dateStr) return { start: null, end: null };
  return {
    start: new Date(dateStr + 'T' + drawTime + ':00+08:00'),
    end:   new Date(dateStr + 'T' + drawEndTime + ':00+08:00'),
  };
}

function getDrawPhase() {
  const { start, end } = getDrawTimes();
  if (!start || !end) return 'before'; // 尚未設定時間
  const now = new Date();
  if (now < start)  return 'before';
  if (now <= end)   return 'open';
  return 'after';
}

function renderDraw() {
  const body = document.getElementById('draw-body');
  const tag  = document.getElementById('draw-status-tag');
  const verifyArea = document.getElementById('verify-area');
  const tabBadge = document.getElementById('draw-tab-badge');
  const phase = getDrawPhase();

  // ── 抽籤已全部完成（不管時間）──
  if (drawState.done) {
    tag.textContent = '抽籤已完成';
    tag.style.cssText = 'margin-left:auto;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:#eaf3de;color:#3b6d11';
    tabBadge.style.display = 'none';
    verifyArea.style.display = 'none';
    let html = '<div class="draw-done-all">✅ 所有隊伍抽籤完成！請點上方「賽程資訊」查看對戰表。</div>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:8px">';
    [...drawData].sort((a,b)=>a.slot-b.slot).forEach(d => {
      html += `<span style="padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;background:var(--blue-light);border:1.5px solid var(--blue);color:var(--blue)">${esc(d.teamname)} — 第${d.slot}籤</span>`;
    });
    html += '</div>';
    body.innerHTML = html;
    return;
  }

  // ── 尚未開始 ──
  if (phase === 'before') {
    tag.textContent = '尚未開始抽籤';
    tag.style.cssText = 'margin-left:auto;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--gray-100);color:var(--gray-400)';
    tabBadge.style.display = 'none';
    verifyArea.style.display = 'none';
    body.innerHTML = '<div style="text-align:center;padding:40px;color:var(--gray-400)"><div style="font-size:36px;margin-bottom:12px">🔒</div>抽籤尚未開始，預定於 <strong>7月17日 09:00</strong> 開放。</div>';
    return;
  }

  // ── 抽籤時間結束（且未全部完成）──
  if (phase === 'after') {
    tag.textContent = '抽籤時間結束';
    tag.style.cssText = 'margin-left:auto;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--gray-100);color:var(--gray-600)';
    tabBadge.style.display = 'none';
    verifyArea.style.display = 'none';
    body.innerHTML = '<div style="text-align:center;padding:40px;color:var(--gray-400)"><div style="font-size:36px;margin-bottom:12px">⏰</div>抽籤時間已結束，未完成抽籤之隊伍將由系統自動補抽。</div>';
    // 觸發後端自動補抽（只呼叫一次，有回應才重新渲染）
    autoFillIfNeeded();
    return;
  }

  // ── 抽籤進行中 ──
  tag.textContent = '抽籤進行中';
  tag.style.cssText = 'margin-left:auto;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:#fff0e6;color:var(--accent)';
  tabBadge.style.display = '';
  tabBadge.textContent = '進行中';

  if (!verifiedTeam) {
    verifyArea.style.display = 'block';
    body.innerHTML = '<div style="text-align:center;color:var(--gray-400);font-size:13px;padding:12px">請先驗證隊伍身份後進行抽籤</div>';
    return;
  }

  const alreadyDrawn = drawData.find(d => d.teamId === verifiedTeam.teamId);
  verifyArea.style.display = 'none';

  if (alreadyDrawn) {
    body.innerHTML = '<div class="draw-done-all">✅ 「'+esc(verifiedTeam.teamname)+'」已完成抽籤，籤號為第 <strong>'+alreadyDrawn.slot+'</strong> 籤。</div>';
    return;
  }

  const done = drawData.length, total = drawState.approvedCount;
  body.innerHTML =
    '<div style="background:var(--blue-light);border:1px solid var(--yt-teal-border);border-radius:var(--radius-lg);padding:16px;text-align:center;margin-bottom:14px">' +
    '<div style="font-size:14px;font-weight:600;color:var(--blue-dark);margin-bottom:4px">👋 歡迎，'+esc(verifiedTeam.teamname)+'</div>' +
    '<div style="font-size:12px;color:var(--blue)">身份驗證成功，請點擊下方按鈕進行抽籤</div></div>' +
    '<div class="draw-display" id="draw-display"><div class="draw-hint">點擊按鈕開始抽籤</div></div>' +
    '<div style="font-size:12px;color:var(--gray-400);text-align:center;margin-bottom:14px">已完成 '+done+' / '+total+' 隊</div>' +
    '<div style="text-align:center"><button onclick="startDraw()" style="padding:12px 40px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit">🎰 開始抽籤</button></div>';
}

// ── 時間結束後觸發後端自動補抽 ──
let autoFillCalled = false;
async function autoFillIfNeeded() {
  if (autoFillCalled) return;
  autoFillCalled = true;
  try {
    const res = await api({ action: 'autoFillDraw', payload: encodeURIComponent(JSON.stringify({ action: 'autoFillDraw' })) });
    if (res.ok && res.filled > 0) {
      // 重新載入抽籤資料後刷新畫面
      const drawRes = await api({ action: 'getDrawData' });
      if (drawRes.ok) {
        drawData = drawRes.draws || [];
        drawState.approvedCount = drawRes.approvedCount || approvedTeams.length;
        drawState.done = drawData.length >= drawState.approvedCount && drawState.approvedCount > 0;
      }
      renderDraw(); renderBracket(); renderScheduleTab();
    }
  } catch(e) { console.error('autoFill error', e); }
}

async function verifyAndDraw() {
  const teamname = document.getElementById('v-teamname').value.trim();
  const sid      = document.getElementById('v-sid').value.trim();
  const errEl    = document.getElementById('verify-err');
  errEl.className = 'verify-err';
  if (!teamname || !sid) { errEl.textContent='請填寫隊伍名稱與隊長學號'; errEl.className='verify-err show'; return; }
  const btn = document.querySelector('.verify-btn');
  btn.disabled=true; btn.textContent='驗證中…';
  try {
    const res = await api({ action:'verifyTeam', payload:encodeURIComponent(JSON.stringify({teamname,captainSid:sid})) });
    if (res.ok) {
      verifiedTeam = { teamId:res.teamId, teamname:res.teamname, captainSid:sid };
      renderDraw();
    } else if (res.alreadyDrawn) {
      verifiedTeam = { teamId:'', teamname };
      drawData.push({ teamId:'', teamname, slot:res.slot });
      renderDraw();
    } else {
      errEl.textContent = res.error||'驗證失敗'; errEl.className='verify-err show';
    }
  } catch(e) { errEl.textContent='網路錯誤，請稍後再試'; errEl.className='verify-err show'; }
  btn.disabled=false; btn.textContent='確認身份並抽籤';
}

async function startDraw() {
  if (drawState.spinning || !verifiedTeam) return;
  if (getDrawPhase() !== 'open') { toast('抽籤時間未開放'); return; }
  drawState.spinning = true;

  const disp = document.getElementById('draw-display');
  if (disp) disp.innerHTML = '<div class="draw-team-label">'+esc(verifiedTeam.teamname)+'</div><div class="draw-num" id="spin-num">-</div>';

  // 先跑視覺動畫（前端假跑），再向後端取得真正籤號
  const avail = [];
  const taken = new Set(drawData.map(d => d.slot));
  for (let i = 1; i <= drawState.approvedCount; i++) { if (!taken.has(i)) avail.push(i); }
  if (!avail.length) { drawState.spinning = false; return; }

  let frame = 0, frames = 22 + Math.floor(Math.random() * 16);
  let apiResult = null;

  // 同步呼叫後端（在動畫期間取得結果）
  api({ action: 'saveDraw', payload: encodeURIComponent(JSON.stringify({ action: 'saveDraw', teamId: verifiedTeam.teamId, teamname: verifiedTeam.teamname, captainSid: verifiedTeam.captainSid })) })
    .then(res => { apiResult = res; })
    .catch(() => { apiResult = { ok: false, error: '網路錯誤' }; });

  spinTimer = setInterval(async () => {
    const rand = avail[Math.floor(Math.random() * avail.length)];
    const el = document.getElementById('spin-num');
    if (el) { el.textContent = '第 ' + rand + ' 籤'; el.className = 'draw-num num-flash'; }
    frame++;

    // 動畫跑完且 API 已回應
    if (frame >= frames && apiResult !== null) {
      clearInterval(spinTimer);
      drawState.spinning = false;

      if (!apiResult.ok) {
        // 已抽過或錯誤
        const el2 = document.getElementById('spin-num');
        if (el2) el2.textContent = apiResult.error || '抽籤失敗';
        if (apiResult.alreadyDrawn) {
          drawData.push({ teamId: verifiedTeam.teamId, teamname: verifiedTeam.teamname, slot: apiResult.slot });
        }
        toast(apiResult.error || '抽籤失敗，請稍後再試');
        setTimeout(() => { renderDraw(); renderBracket(); }, 1500);
        return;
      }

      const picked = apiResult.slot;
      const el2 = document.getElementById('spin-num');
      if (el2) { el2.textContent = '第 ' + picked + ' 籤 ✓'; el2.className = 'draw-num'; }

      drawData.push({ teamId: verifiedTeam.teamId, teamname: verifiedTeam.teamname, slot: picked });
      if (drawData.length >= drawState.approvedCount && drawState.approvedCount > 0) {
        drawState.done = true;
        buildMatches();
      }
      setTimeout(() => { renderDraw(); renderBracket(); renderScheduleTab(); }, 1200);
    }
  }, 80);
}

function renderBracket() {
  const area = document.getElementById('bracket-area');
  const sec  = document.getElementById('bracket-section');
  if (!area||!sec) return;
  if (!drawState.open && !drawState.done) { sec.style.display='none'; return; }
  if (!drawState.approvedCount) { sec.style.display='none'; return; }
  sec.style.display='block';
  const n=drawState.approvedCount, slotMap={};
  drawData.forEach(d=>{ slotMap[d.slot]=d.teamname; });
  const gc=drawState.groupCount||4;
  const labels=['A','B','C','D','E','F'];
  const base=Math.floor(n/gc), extra=n%gc;
  let html='', slotStart=1;
  for(let g=0;g<gc;g++){
    const gsz=base+(g<extra?1:0), end=slotStart+gsz-1;
    html+='<div style="margin-bottom:16px"><div class="bracket-title">⚾ '+labels[g]+' 組（第 '+slotStart+' ～ '+end+' 籤）</div>';
    html+='<div class="bracket-grid">';
    html+='<div class="bracket-row"><div class="bracket-cell header" style="justify-content:center">籤號</div><div class="bracket-cell header">隊伍名稱</div><div class="bracket-cell header" style="justify-content:center">狀態</div></div>';
    for(let s=slotStart;s<=end;s++){
      const team=slotMap[s];
      html+='<div class="bracket-row"'+(team?' style="background:var(--blue-light)"':'')+'>'+
        '<div class="bracket-cell" style="justify-content:center"><span class="bracket-num">第 '+s+' 籤</span></div>'+
        '<div class="bracket-cell"><span class="bracket-slot'+(team?'':' empty')+'">'+(team?esc(team):'待抽籤')+'</span></div>'+
        '<div class="bracket-cell" style="justify-content:center">'+(team?'<span style="color:#3b6d11;font-size:12px">✅ 已抽</span>':'<span style="color:var(--gray-400);font-size:12px">—</span>')+'</div>'+
        '</div>';
    }
    html+='</div></div>';
    slotStart=end+1;
  }
  area.innerHTML='<div style="overflow-x:auto">'+html+'</div>';
}

function buildMatches() {
  const sorted=[...drawData].sort((a,b)=>a.slot-b.slot);
  const s=settings;
  const startDate=new Date(s.gamedate||'2026-08-17');
  const timeSlots=['09:00','11:00','13:30','15:30'], courts=['A場','B場'];
  const gc=drawState.groupCount||4, labels=['A','B','C','D'];
  const base=Math.floor(sorted.length/gc), extra=sorted.length%gc;
  let groups=[],aidx=0;
  for(let g=0;g<gc;g++){const sz=base+(g<extra?1:0);groups.push(sorted.slice(aidx,aidx+sz));aidx+=sz;}
  matchData=[];let mn=1,dayOffset=0,si=0;
  groups.forEach((grp,gi)=>{
    for(let i=0;i<grp.length;i++){
      for(let j=i+1;j<grp.length;j++){
        if(si>=4){si=0;dayOffset++;}
        const d=new Date(startDate);d.setDate(d.getDate()+dayOffset);
        matchData.push({matchNum:'G'+mn++,phase:'分組賽 '+labels[gi]+'組',teamA:grp[i].teamname,teamB:grp[j].teamname,date:(d.getMonth()+1)+'/'+d.getDate(),time:timeSlots[si%4],court:courts[si%2]});
        si++;
      }
    }
  });
  try{api({action:'saveMatches',payload:encodeURIComponent(JSON.stringify({action:'saveMatches',matches:matchData}))});}catch(e){}
}

// TAB 二：賽程圖（分組SVG + 該組賽程）
// ════════════════════════════════
let bracketActiveGroup = 'A';

function renderBracketTab() {
  const slotMap = {};
  drawData.forEach(d => { slotMap[d.slot] = d.teamname; });
  const gc = drawState.groupCount || 4;
  const labels = ['A','B','C','D','E','F'];
  const n = approvedCount || drawData.length;
  const base = Math.floor(n/gc), extra = n%gc;

  // 建立各組資料
  const groups = [];
  let slotStart = 1;
  for (let g = 0; g < gc; g++) {
    const size = base + (g < extra ? 1 : 0);
    const slots = [];
    for (let s = slotStart; s < slotStart+size; s++)
      slots.push({ slot: s, teamname: slotMap[s] || null });
    groups.push({ label: labels[g], slots });
    slotStart += size;
  }

  // 建頁籤（A/B/C/D + 複決賽）
  const tabsHtml = [
    ...groups.map(g => '<button class="grp-tab-btn" id="btab-'+g.label+'" onclick="switchBracketGroup(\''+g.label+'\')">⚾ '+g.label+' 組</button>'),
    '<button class="grp-tab-btn" id="btab-elim" onclick="switchBracketGroup(\'elim\')">🏆 複決賽</button>'
  ].join('');

  document.getElementById('bracket-grp-tabs').innerHTML = tabsHtml;
  document.getElementById('bracket-grp-panel').innerHTML = '';

  // 儲存給切換用
  window._bracketGroups = groups;

  const init = groups.find(g => g.label === bracketActiveGroup) ? bracketActiveGroup : 'A';
  switchBracketGroup(init);
}

function switchBracketGroup(label) {
  bracketActiveGroup = label;
  document.querySelectorAll('.grp-tab-btn[id^="btab-"]').forEach(b =>
    b.classList.toggle('active', b.id === 'btab-'+label)
  );

  const panel = document.getElementById('bracket-grp-panel');
  if (label === 'elim') {
    // 複決賽淘汰圖
    const slotMap = {};
    drawData.forEach(d => { slotMap[d.slot] = d.teamname; });
    const groupTeams = {
      A: [slotMap[1]||'A組第1籤', slotMap[2]||'A組第2籤', slotMap[3]||'A組第3籤', slotMap[4]||'A組第4籤'],
      B: [slotMap[5]||'B組第1籤', slotMap[6]||'B組第2籤', slotMap[7]||'B組第3籤', slotMap[8]||'B組第8籤'],
      C: [slotMap[9]||'C組第1籤', slotMap[10]||'C組第2籤', slotMap[11]||'C組第3籤', slotMap[12]||'C組第4籤'],
      D: [slotMap[13]||'D組第1籤', slotMap[14]||'D組第2籤', slotMap[15]||'D組第3籤', slotMap[16]||'D組第4籤'],
    };
    panel.innerHTML =
      '<div class="elim-box" style="margin-top:8px">' +
      '<div class="elim-box-title">🏆 八強 → 四強 → 季軍賽 / 決賽</div>' +
      '<div class="elim-svg-wrap">' + drawElimSVG(groupTeams, {}) + '</div>' +

  } else {
    const group = (window._bracketGroups || []).find(g => g.label === label);
    if (!group) return;
    const groupMatches = matchData.filter(m => m.phase && m.phase.includes(label+'組'));
    panel.innerHTML =
      // SVG 循環賽圖
      '<div class="group-box" style="margin-bottom:16px">' +
      '<div class="group-box-title">⚾ ' + label + ' 組</div>' +
      '<div class="group-svg-wrap">' + buildSVG(group, groupMatches) + '</div>' +
      '</div>' +
      // 賽程時間表
      renderGroupTable(group, groupMatches);
  }
}

// ── 籤號文字 → 隊名對應（處理舊資料）──

// ═══ 循環賽排名引擎（依競賽規程：積分→對戰→TQB→人工裁定）═══
function groupTeamList(label) {
  const set = {};
  matchData.filter(m => m.phase && m.phase.indexOf(label + '組') >= 0).forEach(m => {
    const a = resolveBase(m.teamA), b = resolveBase(m.teamB);
    if (a) set[a] = 1; if (b) set[b] = 1;
  });
  return Object.keys(set);
}
// 只解析籤號，不解析名次（避免排名引擎遞迴）
function resolveBase(name) {
  if (!name) return name;
  const slotMap = {};
  drawData.forEach(d => { slotMap[d.slot] = d.teamname; });
  const m1 = String(name).match(/^第(\d+)籤$/);
  if (m1) return slotMap[parseInt(m1[1])] || name;
  return name;
}
function hasScoreOf(m){ return m.scoreA!==undefined&&m.scoreA!==''&&m.scoreB!==undefined&&m.scoreB!==''; }
// 終場＝比分＋勝隊(J欄)都填；只有比分＝比賽中
function isFinalOf(m){ return hasScoreOf(m) && !!m.winner; }
function isLiveOf(m){ return hasScoreOf(m) && !m.winner; }

function computeStandings(label) {
  const teams = groupTeamList(label);
  const games = matchData.filter(m => m.phase && m.phase.indexOf(label + '組') >= 0);
  const played = games.filter(isFinalOf);
  const allDone = games.length > 0 && played.length === games.length;

  // 人工裁定優先：賽事設定 rankA / rankB… = 「隊名1,隊名2,…」
  const override = (settings['rank' + label] || '').split(/[,，]/).map(x=>x.trim()).filter(Boolean);
  if (override.length >= teams.length && teams.length > 0) {
    return { rows: override.map((t,i)=>({team:t, rank:i+1, ...recordOf(t,played), tieNote:'人工裁定'})), allDone, resolved:true, manual:true };
  }

  function recordOf(t, gs) {
    let w=0,l=0;
    gs.forEach(m=>{
      const a=resolveBase(m.teamA), b=resolveBase(m.teamB);
      if(a!==t&&b!==t)return;
      const winner = m.winner || '';
      if(winner===t)w++; else if(winner)l++;
    });
    return {w,l,pts:w*3};
  }

  let rows = teams.map(t=>({team:t, ...recordOf(t,played)}));
  rows.sort((a,b)=>b.pts-a.pts);

  // 同積分群組逐一處理
  let rank=1, out=[], unresolved=false;
  for(let i=0;i<rows.length;){
    let j=i; while(j<rows.length&&rows[j].pts===rows[i].pts)j++;
    const cluster=rows.slice(i,j);
    if(cluster.length===1){ cluster[0].rank=rank; out.push(cluster[0]); }
    else{
      const names=cluster.map(c=>c.team);
      const mutual=played.filter(m=>names.indexOf(resolveBase(m.teamA))>=0&&names.indexOf(resolveBase(m.teamB))>=0);
      // (1) 相互對戰積分
      cluster.forEach(c=>{ c.h2h=recordOf(c.team,mutual).pts; });
      // (2) TQB：相互對戰 得分率-失分率（需局數）
      let tqbOK=true;
      cluster.forEach(c=>{
        let rs=0,ra=0,atkInn=0,defInn=0;
        mutual.forEach(m=>{
          const a=resolveBase(m.teamA), b=resolveBase(m.teamB);
          const iA=Number(m.inningsA), iB=Number(m.inningsB);
          if(a===c.team){ rs+=Number(m.scoreA); ra+=Number(m.scoreB); atkInn+=iA; defInn+=iB; if(!iA||!iB)tqbOK=false; }
          if(b===c.team){ rs+=Number(m.scoreB); ra+=Number(m.scoreA); atkInn+=iB; defInn+=iA; if(!iA||!iB)tqbOK=false; }
        });
        c.tqb=(atkInn&&defInn)?(rs/atkInn-ra/defInn):null;
      });
      cluster.sort((a,b)=>{
        if(b.h2h!==a.h2h)return b.h2h-a.h2h;
        if(tqbOK&&a.tqb!==null&&b.tqb!==null&&b.tqb!==a.tqb)return b.tqb-a.tqb;
        return 0;
      });
      // 標記無法判定的並列（不提供暫定排序，避免爭議）
      for(let k=0;k<cluster.length;k++){
        const c=cluster[k], prev=cluster[k-1];
        const tied=prev&&prev.h2h===c.h2h&&(!tqbOK||prev.tqb===c.tqb);
        if(tied){
          c.pending=true; prev.pending=true;
          c.tieNote=prev.tieNote=(tqbOK?'人工裁定中':'待填局數或人工裁定');
          unresolved=true;
        } else if(cluster.length>1){
          c.tieNote=tqbOK&&c.tqb!==null?('TQB '+c.tqb.toFixed(3)):'對戰判定';
        }
      }
      // 並列隊伍改以隊名筆畫排序呈現（僅為顯示順序，非名次）
      let k2=0;
      while(k2<cluster.length){
        if(cluster[k2].pending){
          let j2=k2; while(j2<cluster.length&&cluster[j2].pending)j2++;
          const seg=cluster.slice(k2,j2).sort((a,b)=>String(a.team).localeCompare(String(b.team),'zh-Hant'));
          for(let t2=0;t2<seg.length;t2++)cluster[k2+t2]=seg[t2];
          k2=j2;
        } else k2++;
      }
      cluster.forEach((c,k)=>{ c.rank=rank+k; out.push(c); });
    }
    rank+=cluster.length; i=j;
  }
  return { rows: out, allDone, resolved: allDone && !unresolved, manual:false };
}

// 場次勝隊 / 敗隊（供 Q1勝隊、S1敗隊等標籤解析）
function teamOfMatch(num, wantWinner) {
  const m = matchData.find(x=>String(x.matchNum).toUpperCase()===String(num).toUpperCase());
  if(!m||!isFinalOf(m))return null;
  const a=resolveBase(m.teamA), b=resolveBase(m.teamB);
  const winner=m.winner;
  if(!winner||winner==='平局')return null;
  return wantWinner?winner:(winner===a?b:a);
}

function resolveTeamName(name) {
  if (!name) return name;
  const slotMap = {};
  drawData.forEach(d => { slotMap[d.slot] = d.teamname; });

  // 格式一：「第N籤」→ 直接查 slotMap
  const m1 = String(name).match(/^第(\d+)籤$/);
  if (m1) return slotMap[parseInt(m1[1])] || name;

  // 格式二：「A組第N籤」→ 換算全局籤號
  const m2 = String(name).match(/([A-D])組第(\d+)籤/);
  if (m2) {
    const gc = drawState.groupCount || 4;
    const n  = approvedCount || drawData.length;
    const base = Math.floor(n/gc), extra = n%gc;
    const labels = ['A','B','C','D','E','F'];
    let slotStart = 1;
    for (let g = 0; g < gc; g++) {
      const sz = base + (g < extra ? 1 : 0);
      if (labels[g] === m2[1]) {
        const slot = slotStart + parseInt(m2[2]) - 1;
        return slotMap[slot] || name;
      }
      slotStart += sz;
    }
  }

  // 格式三：「A組第N名」→ 循環賽排名（全部賽畢且名次確定才帶入）
  const m3 = String(name).match(/^([A-D])組第(\d+)名$/);
  if (m3) {
    try {
      const st = computeStandings(m3[1]);
      if (st.allDone) {
        const row = st.rows.find(r => r.rank === parseInt(m3[2]));
        if (row && !row.pending) return row.team;
      }
    } catch(e) {}
    return name;
  }

  // 格式四：「Q1勝隊 / S1敗隊」等 → 依場次結果帶入
  const m4 = String(name).match(/^([A-Z]+\d+)\s*(勝|敗)隊?$/);
  if (m4) {
    const t = teamOfMatch(m4[1], m4[2] === '勝');
    if (t) return t;
    return name;
  }

  return name; // 已是隊名或無法解析，直接回傳
}

// 卡片顯示用簡稱（去除國立/私立前綴；彈窗與其他處仍用全名）
function shortTeamName(n){ return String(n||'').replace(/^(國立|私立|市立|縣立)/,''); }
// ── 隊徽：logos/隊名.png；無檔案時顯示色圓＋校名首字 ──
function teamLogoHtml(name) {
  if (!name || /組第|勝隊|敗隊|籤$/.test(name)) return '';
  // 優先採用「賽事設定」表手動指定的顏色
  // key: color:隊名        value: #RRGGBB（底色，必填才生效）
  // key: color2:隊名       value: #RRGGBB（文字色，選填，同校第二代表色用來與同色系隊伍區隔）
  const manual  = settings && settings['color:' + name];
  const manual2 = settings && settings['color2:' + name];
  const palette = ['#00695C','#1a5fa8','#c4601a','#7b1fa2','#c0392b','#2e7d32','#5d4037','#455a64',
                    '#00838f','#6a1b9a','#ad1457','#558b2f','#e65100','#283593','#4e342e','#37474f'];
  let h = 0; for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 9973;
  const color  = manual || palette[h % palette.length];
  const txtColor = manual2 || '#fff';
  // 取校名代表字：優先用「賽事設定」表指定的字（key: char:隊名，value: 單一字），
  // 否則預設去掉「國立/私立/市立」後的第一個字
  const manualChar = settings && settings['char:' + name];
  const ch = manualChar || name.replace(/^(國立|私立|市立|縣立)/, '').charAt(0) || '?';
  return '<img class="tlogo" src="logos/' + encodeURIComponent(name) + '.png" alt="" ' +
    'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'inline-flex\'">' +
    '<span class="tlogo-fb" style="display:none;background:' + color + ';color:' + txtColor + '">' + esc(ch) + '</span>';
}


// 比數卡捲動箭頭：內容超寬時顯示
function initStripArrows(wrapId) {
  const wrap = document.getElementById(wrapId);
  if (!wrap) return;
  const strip = wrap.querySelector('.score-strip');
  const L = wrap.querySelector('.strip-btn.left'), R = wrap.querySelector('.strip-btn.right');
  if (!strip || !L || !R) return;
  function upd() {
    const over = strip.scrollWidth > strip.clientWidth + 4;
    L.style.display = (over && strip.scrollLeft > 4) ? 'flex' : 'none';
    R.style.display = (over && strip.scrollLeft < strip.scrollWidth - strip.clientWidth - 4) ? 'flex' : 'none';
  }
  L.onclick = () => strip.scrollBy({left:-400, behavior:'smooth'});
  R.onclick = () => strip.scrollBy({left: 400, behavior:'smooth'});

  window.addEventListener('resize', upd);
  setTimeout(upd, 50);
}

// ── 賽事詳情彈窗 ──
function pitcherBlock(raw, type) {
  if (!raw) return '';
  const p = String(raw).split(/[,，]/).map(x=>x.trim());
  const tags = {w:['WIN','w'], l:['LOSS','l'], sv:['SAVE','sv']};
  const labels = ['投球局數','自責分','三振','四壞'];
  let stats = '';
  for (let i=0;i<4;i++){
    if (p[i+1]!==undefined&&p[i+1]!=='') stats += '<div class="gm-pit-stat"><div class="v">'+esc(p[i+1])+'</div><div class="k">'+labels[i]+'</div></div>';
  }
  return '<div class="gm-pit-card">' +
    '<div class="gm-pit-name"><span class="gm-tag '+tags[type][1]+'">'+tags[type][0]+'</span>'+esc(p[0]||'')+'</div>' +
    '<div class="gm-pit-stats">'+stats+'</div></div>';
}
// ── 先發名單區塊：格式「姓名(守位),姓名(守位),…」自動編 1~9 棒；「投手:姓名」列於最後 ──
function lineupCol(team, raw) {
  // 頂層以逗號分隔＝棒次；同一格內用分號分隔＝換人（頂替上一位，不佔新號碼，縮排顯示）
  const slots = String(raw).split(/[,，](?![^(（]*[\)）])/).map(x=>x.trim()).filter(Boolean)
    .reduce((acc, tok) => {
      // 分號可能跟在前一個 token 尾端一起被逗號誤切開的情況很少見；這裡以分號優先切
      acc.push(tok); return acc;
    }, []);
  // 若含分號，需要把「同一棒次內的換人」正確分組：先用分號切，再對每組視為一個棒次
  const raw2 = String(raw);
  const groups = [];
  let buf = '';
  let depth = 0;
  for (let i = 0; i < raw2.length; i++) {
    const ch = raw2[i];
    if (ch === '(' || ch === '（') depth++;
    if (ch === ')' || ch === '）') depth--;
    if (ch === ',' && depth === 0) { groups.push(buf); buf = ''; }
    else buf += ch;
  }
  if (buf.trim()) groups.push(buf);

  let rows = '', num = 1, pitcher = '';
  groups.forEach(g => {
    const parts = g.split(';').map(x=>x.trim()).filter(Boolean);
    parts.forEach((it, idx) => {
      const pm = it.match(/^(投手|先發投手|P)[:：]\s*(.+)$/);
      if (pm) { pitcher = pm[2]; return; }
      const m = it.match(/^(.+?)[\(（](.+?)[\)）]$/);
      const nm = m ? m[1] : it, posRaw = m ? m[2] : '';
      const subTags = ['代打','代跑','代守','PH','PR','PD'];
      let tag = '', pos = posRaw;
      subTags.forEach(t => { if (posRaw.indexOf(t) >= 0) { tag = t; pos = posRaw.replace(t,'').replace(/^[,，]|[,，]$/g,'').trim(); } });
      if (idx === 0) {
        rows += '<div class="gm-lu-row"><span class="gm-lu-num">'+(num++)+'</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(nm)+'</span>'+(pos?'<span class="gm-lu-pos">'+esc(pos)+'</span>':'')+'</div>';
      } else {
        rows += '<div class="gm-lu-row sub">'+(tag?'<span class="gm-lu-subtag">'+esc(tag)+'</span>':'')+'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(nm)+'</span>'+(pos?'<span class="gm-lu-pos">'+esc(pos)+'</span>':'')+'</div>';
      }
    });
  });
  if (pitcher) rows += '<div class="gm-lu-row" style="margin-top:4px;padding-top:6px;border-top:1px dashed var(--gray-100)"><span class="gm-lu-num" style="background:#fdf0e6;color:#c4601a">P</span><span>'+esc(pitcher)+'</span><span class="gm-lu-pos">先發投手</span></div>';
  return '<div class="gm-lineup-col"><div class="gm-lineup-head">'+teamLogoHtml(team)+esc(shortTeamName(team))+'</div>'+rows+'</div>';
}
function buildLineupSection(m, a, b) {
  if (!m.lineupA && !m.lineupB) return '';
  let cols = '';
  if (m.lineupA) cols += lineupCol(a, m.lineupA);
  if (m.lineupB) cols += lineupCol(b, m.lineupB);
  return '<div class="gm-sec"><div class="gm-sec-title">STARTING LINEUP</div><div class="gm-lineup">'+cols+'</div></div>';
}

// ── 投手運用區塊：Y/Z 欄「姓名(角色):局數,自責分,三振,四壞」逗號分隔，成績選填 ──
function pitcherUsageCol(team, raw) {
  // 先以「,姓名(」的節奏切出每位投手（成績內也有逗號，需聰明切分）
  const items = String(raw).split(/[,，、](?=[^,，、:：]+[\(（])/).map(x=>x.trim()).filter(Boolean);
  const roleMap = { '先發':'sp', '中繼':'mr', '後援':'cl', '救援':'cl', '終結':'cl' };
  let rows = '';
  items.forEach(it => {
    const m = it.match(/^(.+?)[\(（](.+?)[\)）]\s*(?:[:：]\s*(.+))?$/);
    const nm = m ? m[1] : it, role = m ? m[2] : '', stats = m && m[3] ? m[3].split(/[,，]/).map(x=>x.trim()) : null;
    const cls = roleMap[role] || 'xx';
    const statTxt = stats ? [stats[0]&&stats[0]+'局', stats[1]!==undefined&&stats[1]!==''?'自責'+stats[1]:'', stats[2]?'K'+stats[2]:'', stats[3]?'BB'+stats[3]:''].filter(Boolean).join(' · ') : '';
    rows += '<div class="gm-pu-row">'+(role?'<span class="gm-role '+cls+'">'+esc(role)+'</span>':'')+'<span style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(nm)+'</span>'+(statTxt?'<span class="gm-pu-stats">'+esc(statTxt)+'</span>':'')+'</div>';
  });
  return '<div class="gm-lineup-col"><div class="gm-lineup-head">'+teamLogoHtml(team)+esc(shortTeamName(team))+'</div>'+rows+'</div>';
}
function buildPitchersSection(m, a, b) {
  if (!m.pitchersA && !m.pitchersB) return '';
  let cols = '';
  if (m.pitchersA) cols += pitcherUsageCol(a, m.pitchersA);
  if (m.pitchersB) cols += pitcherUsageCol(b, m.pitchersB);
  return '<div class="gm-sec"><div class="gm-sec-title">PITCHERS 投手運用</div><div class="gm-lineup">'+cols+'</div></div>';
}

let currentModalNum = null;
function openGameModal(num) {
  const m = matchData.find(x=>String(x.matchNum)===String(num));
  if (!m) return;
  currentModalNum = num;
  const a = resolveTeamName(m.teamA), b = resolveTeamName(m.teamB);
  const fin = isFinalOf(m), liv = isLiveOf(m);
  const winA = fin && Number(m.scoreA)>Number(m.scoreB);
  const winB = fin && Number(m.scoreB)>Number(m.scoreA);
  let html = '<div class="gm-head"><span class="m">'+esc(m.matchNum)+' · '+esc((m.phase||'').replace('分組賽 ','預賽 '))+'</span>' +
    '<button class="gm-close" onclick="closeGameModal()">✕</button></div>';
  html += '<div class="gm-score">' +
    '<div class="gm-team">'+teamLogoHtml(a)+'<span class="n">'+esc(a)+'</span></div>' +
    '<div class="gm-big">'+((fin||liv)?'<span class="'+(winA?'win':'')+'">'+m.scoreA+'</span><span style="color:var(--gray-300);font-size:20px">:</span><span class="'+(winB?'win':'')+'">'+m.scoreB+'</span>':'<span style="font-size:16px;color:var(--gray-400)">VS</span>')+'</div>' +
    '<div class="gm-team">'+teamLogoHtml(b)+'<span class="n">'+esc(b)+'</span></div></div>';
  html += '<div class="gm-status">'+(fin?'終場':liv?'<span style="color:#c0392b">● 比賽中</span>':'未開賽')+' · '+fmtDate(m.date)+' '+fmtTime(m.time)+(m.court?' · '+esc(m.court):'')+'</div>';
  if (m.lineA || m.lineB) html += '<div class="gm-sec"><div class="gm-sec-title">SCORE</div>'+buildLineScore(m)+'</div>';
  html += buildLineupSection(m, a, b);
  const pit = pitcherBlock(m.pitcherW,'w') + pitcherBlock(m.pitcherL,'l') + pitcherBlock(m.pitcherSV,'sv');
  if (pit) html += '<div class="gm-sec"><div class="gm-sec-title">PITCHING SUMMARY</div><div class="gm-pit">'+pit+'</div></div>';
  html += buildPitchersSection(m, a, b);
  if (m.recordUrl) html += '<div class="gm-sec" style="text-align:center;padding-top:0"><a href="'+esc(m.recordUrl)+'" target="_blank" rel="noopener" style="display:inline-block;padding:8px 20px;background:var(--yt-teal-light);border:1px solid var(--yt-teal-border);border-radius:20px;font-size:13px;font-weight:600;color:var(--yt-teal-dark);text-decoration:none">📄 查看紀錄表</a></div>';

    ov.id = 'game-modal'; ov.className = 'gm-overlay';
    ov.addEventListener('click', e => { if (e.target === ov) closeGameModal(); });
    document.body.appendChild(ov);
  }
  ov.innerHTML = '<div class="gm-panel">'+html+'</div>';
  ov.classList.add('open');

function closeGameModal() {
  currentModalNum = null;
  const ov = document.getElementById('game-modal');
  if (ov) ov.classList.remove('open');
}

// ── 最新戰況比數卡 ──
function renderScoreCards() {
  const live    = matchData.filter(isLiveOf);
  const finals  = matchData.filter(isFinalOf);
  const pending = matchData.filter(m => !hasScoreOf(m));
  // 比賽中優先 ＋ 已完賽最近 6 場 ＋ 即將進行 4 場
  const cards = live.concat(finals.slice(-6).reverse()).concat(pending.slice(0, 4));
  if (!cards.length) return '';
  let html = '<div class="score-strip">';
  cards.forEach(m => {
    const a = resolveTeamName(m.teamA), b = resolveTeamName(m.teamB);
    const fin  = isFinalOf(m);
    const liv  = isLiveOf(m);
    const winA = fin && Number(m.scoreA) > Number(m.scoreB);
    const winB = fin && Number(m.scoreB) > Number(m.scoreA);
    html += '<div class="score-card" style="cursor:pointer" onclick="openGameModal(\''+esc(String(m.matchNum))+'\')">' +
      '<div class="score-card-status"><span class="'+(fin?'final':liv?'live':'')+'">'+(fin?'終場':liv?'● 比賽中':'未開賽')+'</span><span>'+esc(m.matchNum)+' · '+fmtDate(m.date)+' '+fmtTime(m.time)+'</span></div>' +
      '<div class="score-card-row'+(winA?' winner':'')+'"><span class="t" style="display:flex;align-items:center;gap:7px">'+teamLogoHtml(a)+'<span style="overflow:hidden;text-overflow:ellipsis">'+esc(shortTeamName(a))+'</span></span><span class="s">'+((fin||liv)?m.scoreA+(winA?' ◂':''):'')+'</span></div>' +
      '<div class="score-card-row'+(winB?' winner':'')+'"><span class="t" style="display:flex;align-items:center;gap:7px">'+teamLogoHtml(b)+'<span style="overflow:hidden;text-overflow:ellipsis">'+esc(shortTeamName(b))+'</span></span><span class="s">'+((fin||liv)?m.scoreB+(winB?' ◂':''):'')+'</span></div>' +
      '</div>';
  });
  return '<div class="strip-wrap" id="sched-strip-wrap">' +
    '<button class="strip-btn left" aria-label="向左捲動">‹</button>' +
    html + '</div>' +
    '<button class="strip-btn right" aria-label="向右捲動">›</button></div>';
}

// ── 逐局計分板 ──
function buildLineScore(m) {
  const a = resolveTeamName(m.teamA), b = resolveTeamName(m.teamB);
  const lineA = String(m.lineA||'').split(',').map(x=>x.trim());
  const lineB = String(m.lineB||'').split(',').map(x=>x.trim());
  const n = Math.max(lineA.length, lineB.length);  // 依實際局數顯示（7局制、延長賽皆自動適應）
  const heA = String(m.heA||'').split(',').map(x=>x.trim());
  const heB = String(m.heB||'').split(',').map(x=>x.trim());
  const hasHE = (m.heA||m.heB);
  let html = '<div class="linescore-wrap"><table class="linescore"><thead><tr><th></th>';
  for (let i=1;i<=n;i++) html += '<th>'+i+'</th>';
  html += '<th style="border-left:2px solid var(--gray-200)">R</th>'+(hasHE?'<th>H</th><th>E</th>':'')+'</tr></thead><tbody>';
  [[a,lineA,m.scoreA,heA],[b,lineB,m.scoreB,heB]].forEach(row => {
    html += '<tr><td class="tname"><span style="display:inline-flex;align-items:center;gap:7px">'+teamLogoHtml(row[0])+esc(row[0])+'</span></td>';
    for (let i=0;i<n;i++) html += '<td>'+esc(row[1][i]!==undefined&&row[1][i]!==''?row[1][i]:'')+'</td>';
    html += '<td class="rhe">'+row[2]+'</td>'+(hasHE?'<td class="rhe" style="border-left:none">'+esc(row[3][0]||'')+'</td><td class="rhe" style="border-left:none">'+esc(row[3][1]||'')+'</td>':'');
    html += '</tr>';
  });
  return html + '</tbody></table></div>';
}
function toggleLineScore(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  const open = el.style.display !== 'none';
  el.style.display = open ? 'none' : '';
  if (btn) btn.textContent = open ? '📊 每局' : '收合';
}

function renderTotalSchedule() {
  const tag  = document.getElementById('sched-status-tag');
  const area = document.getElementById('total-schedule-area');
  const done = drawData.length >= approvedCount && approvedCount > 0;

  if (done) { tag.className='status-tag st-done'; tag.textContent='✅ 抽籤已完成'; }
  else if (drawState.open) { tag.className='status-tag st-open'; tag.textContent='🎰 抽籤進行中'; }
  else { tag.className='status-tag st-closed'; tag.textContent='⏳ 抽籤尚未開放'; }

  if (!matchData.length) {
    area.innerHTML = '<div style="text-align:center;padding:48px;color:var(--gray-400)">賽程尚未公布，請待抽籤完成後查看。</div>';
    return;
  }

  // 依日期分組
  const byDate = {};
  matchData.forEach(m => {
    const d = fmtDate(m.date) || String(m.date) || '日期未定';
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(m);
  });
  const dates = sortDateKeys(Object.keys(byDate));

  // 日期快速跳轉列
  const jumpBar = '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">' +
    dates.map(d =>
      '<a href="#date-'+d.replace('/','_')+'" style="padding:6px 16px;background:var(--yt-teal-light);' +
      'border:1px solid var(--yt-teal-border);border-radius:20px;font-size:13px;font-weight:600;' +
      'color:var(--yt-teal-dark);text-decoration:none;transition:all .15s" ' +
      'onmouseover="this.style.background=\'var(--yt-teal-dark)\';this.style.color=\'#fff\'" ' +
      'onmouseout="this.style.background=\'var(--yt-teal-light)\';this.style.color=\'var(--yt-teal-dark)\'">'+
      '📅 '+d+'</a>'
    ).join('') +
    '</div>';

function buildSVG(group,matches){
  const slots=group.slots,n=slots.length,size=500,pad=90,cx=size/2,cy=size/2;
  let positions=[];
  if(n===3){positions=[{x:cx,y:pad-20},{x:pad-10,y:size-pad+20},{x:size-pad+10,y:size-pad+20}];}
  else{positions=[{x:pad,y:pad},{x:size-pad,y:pad},{x:size-pad,y:size-pad},{x:pad,y:size-pad}];
    if(n>4)positions.push({x:cx,y:pad-20});}

  // 建立隊名/籤號 → 位置索引
  function nameToIdx(name) {
    if (name === undefined || name === null || name === '') return -1;
    const s = String(name).trim();
    // 直接找隊名
    let idx = slots.findIndex(sl => sl.teamname === s);
    if (idx >= 0) return idx;
    // 純數字 → 當作全局籤號
    if (/^\d+$/.test(s)) {
      idx = slots.findIndex(sl => String(sl.slot) === s);
      if (idx >= 0) return idx;
    }
    // 「第N籤」→ 找對應的全局籤號
    const m1 = s.match(/第\s*(\d+)\s*籤/);
    if (m1) {
      idx = slots.findIndex(sl => String(sl.slot) === m1[1]);
      if (idx >= 0) return idx;
    }
    return -1;
  }

  // 依「對戰的兩隊角落」決定場次框位置，採固定佈局避免重疊。
  // 四隊循環賽有六場：四邊各一、兩條對角線兩場（中央上下錯開）。
  function slotPairKey(ai, bi) {
    return [ai, bi].sort((x, y) => x - y).join('-');
  }
  // 針對 n===4 的固定位置表：索引 0=左上,1=右上,2=右下,3=左下
  const fixedCenters4 = {
    '0-1': {x: cx,            y: pad},              // 上邊
    '1-2': {x: size - pad,    y: cy},              // 右邊
    '2-3': {x: cx,            y: size - pad},      // 下邊
    '0-3': {x: pad,           y: cy},              // 左邊
    '0-2': {x: cx,            y: cy - 58},         // 對角線（中央偏上）
    '1-3': {x: cx,            y: cy + 58},         // 對角線（中央偏下）
  };

  const usedCenters = [];
  // n===4：完全確定式佈局。先算出每場對應的角落 key，再依 key 指派固定位置。
  // 兩條對角線 (0-2, 1-3) 一律置中、上下錯開，永不碰撞、永不偏移，確保每組都是一致的大 X。
  const diagQueue = ['0-2', '1-3']; // 中央上、中央下
  const matchLabels = matches.map(match => {
    const ai = nameToIdx(match.teamA);
    const bi = nameToIdx(match.teamB);
    let mx, my;
    if (n === 4 && ai >= 0 && bi >= 0) {
      let key = slotPairKey(ai, bi);
      // 對角線一律導向置中槽位（依出現順序：先上、後下），避免重疊到 cx,cy
      if (key === '0-2' || key === '1-3') {
        key = diagQueue.length ? diagQueue.shift() : key;
      }
      const c = fixedCenters4[key] || {x: cx, y: cy};
      mx = c.x; my = c.y;
    } else {
      // 其他隊數（3、5隊等）沿用中點 + 簡易防重疊
      const pi = (ai >= 0) ? positions[ai] : {x:cx, y:cy};
      const pj = (bi >= 0) ? positions[bi] : {x:cx, y:cy};
      mx = Math.round((pi.x+pj.x)/2);
      my = Math.round((pi.y+pj.y)/2);
      let guard = 0;
      while (usedCenters.some(c => Math.abs(c.x-mx)<30 && Math.abs(c.y-my)<30) && guard < 6) {
        my += 50; guard++;
      }
    }
    usedCenters.push({x:mx, y:my});
    return {mx, my, match};
  });
  let svg='<svg viewBox="0 0 '+size+' '+size+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:440px;display:block;margin:0 auto">';
  svg+='<rect width="'+size+'" height="'+size+'" fill="#f0f8f5" rx="12"/>';
  for(let i=0;i<n;i++){for(let j=i+1;j<n;j++){
    const pi=positions[i]||{x:cx,y:cy},pj=positions[j]||{x:cx,y:cy};
    svg+='<line x1="'+pi.x+'" y1="'+pi.y+'" x2="'+pj.x+'" y2="'+pj.y+'" stroke="#d5d4ce" stroke-width="1.5" stroke-dasharray="4,3"/>';
  }}
  matchLabels.forEach(({mx,my,match})=>{
    const hasScore=match&&match.scoreA!==undefined&&match.scoreA!==''&&match.scoreB!==undefined&&match.scoreB!=='';
    svg+='<rect x="'+(mx-32)+'" y="'+(my-24)+'" width="64" height="48" rx="6" fill="'+(hasScore?'#eaf3de':'#fff')+'" stroke="'+(hasScore?'#c0dd97':'#d5d4ce')+'" stroke-width="1"/>';
    if(match){
      svg+='<text x="'+mx+'" y="'+(my-10)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#1a5fa8">'+esc(match.matchNum)+'</text>';
      if(hasScore)svg+='<text x="'+mx+'" y="'+(my+6)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#1d9e75">'+match.scoreA+':'+match.scoreB+'</text>';
      else{svg+='<text x="'+mx+'" y="'+(my+6)+'" text-anchor="middle" font-size="10" fill="#888">'+fmtDate(match.date)+'</text>';
        svg+='<text x="'+mx+'" y="'+(my+19)+'" text-anchor="middle" font-size="10" fill="#888">'+fmtTime(match.time)+'</text>';}
    }else svg+='<text x="'+mx+'" y="'+(my+4)+'" text-anchor="middle" font-size="10" fill="#aaa">待定</text>';
  });
  slots.forEach((slot,i)=>{
    const pos=positions[i]||{x:cx,y:cy};
    const name=slot.teamname||('第'+slot.slot+'籤'),isEmpty=!slot.teamname;
    const maxLen=6;let line1=name,line2='';
    if(name.length>maxLen){line1=name.slice(0,maxLen);line2=name.slice(maxLen,maxLen*2);if(name.length>maxLen*2)line2=line2.slice(0,maxLen-1)+'…';}
    const boxH=line2?52:40;
    svg+='<rect x="'+(pos.x-44)+'" y="'+(pos.y-boxH/2)+'" width="88" height="'+boxH+'" rx="8" fill="'+(isEmpty?'#ededea':'var(--yt-teal-light)')+'" stroke="'+(isEmpty?'#d5d4ce':'var(--yt-teal)')+'" stroke-width="1.5"/>';
    svg+='<text x="'+pos.x+'" y="'+(pos.y-boxH/2+14)+'" text-anchor="middle" font-size="10" fill="#888">第'+slot.slot+'籤</text>';
    svg+='<text x="'+pos.x+'" y="'+(pos.y-boxH/2+28)+'" text-anchor="middle" font-size="12" font-weight="700" fill="'+(isEmpty?'#888780':'var(--yt-teal-dark)')+'">'+esc(line1)+'</text>';
    if(line2)svg+='<text x="'+pos.x+'" y="'+(pos.y-boxH/2+42)+'" text-anchor="middle" font-size="12" font-weight="700" fill="'+(isEmpty?'#888780':'var(--yt-teal-dark)')+'">'+esc(line2)+'</text>';
  });
  svg+='</svg>';
  return svg;
}

function drawGroupSVG(teams) {
  var W = 300, H = 260;
  // 四隊放在正方形四角（順時針：左上、右上、右下、左下）
  var pos = [
    {x: 58,  y: 52},
    {x: 242, y: 52},
    {x: 242, y: 208},
    {x: 58,  y: 208},
  ];

  // 所有隊伍兩兩之間都畫連線（循環賽 = 6 場）
  var pairs = [[0,1],[1,2],[2,3],[3,0],[0,2],[1,3]];

  pairs.forEach(function(p) {
    var key = p[0]+','+p[1];

    svg += '<line x1="' + pos[p[0]].x + '" y1="' + pos[p[0]].y +
           '" x2="' + pos[p[1]].x + '" y2="' + pos[p[1]].y +
           '" stroke="' + (diag ? '#9FD9CE' : '#00695C') +
           '" stroke-width="1.5"' + (diag ? ' stroke-dasharray="5,4"' : '') + '/>';
  });

  // 四個角的隊伍標籤
  var labels = [
    {x: 58,  y: 52,  ax: 'middle', dx: 0,   dy: -18},
    {x: 242, y: 52,  ax: 'middle', dx: 0,   dy: -18},
    {x: 242, y: 208, ax: 'middle', dx: 0,   dy: 22},
    {x: 58,  y: 208, ax: 'middle', dx: 0,   dy: 22},

  labels.forEach(function(l, i) {

           '" text-anchor="' + l.ax + '" font-size="12" font-weight="700" fill="#00695C">' +
           esc(short) + '</text>';
  });

  svg += '</svg>';
  return svg;
}

function drawElimSVG(groupTeams, advance) {
  advance = advance || {};
  var W = 800, H = 370;
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" style="width:100%;min-width:560px">';
  svg += '<rect width="' + W + '" height="' + H + '" fill="#f0f8f5" rx="10"/>';

  // 8強位置（Q1=A1vD2, Q2=B1vC2, Q3=C1vB2, Q4=D1vA2）
  // name 欄：顯示用的標籤（A組第1名等）
  // label 欄：小字標示（A1/D2等，供識別對應組別）
  var q8 = [
    {x:55,  label:'A1', display:'A組第1名'},
    {x:155, label:'D2', display:'D組第2名'},
    {x:255, label:'B1', display:'B組第1名'},
    {x:355, label:'C2', display:'C組第2名'},
    {x:455, label:'C1', display:'C組第1名'},
    {x:555, label:'B2', display:'B組第2名'},
    {x:655, label:'D1', display:'D組第1名'},
    {x:755, label:'A2', display:'A組第2名'},
  ];

  var y8 = 330, y4 = 235, yS = 148, yF = 52;

  // 繪製8強隊伍框
  q8.forEach(function(t) {
    var resolved = resolveTeamName(t.display);
    var isReal = resolved !== t.display;
    var short = resolved.length > 6 ? resolved.slice(0,6)+'…' : resolved;
    svg += '<rect x="' + (t.x-42) + '" y="' + (y8-18) + '" width="84" height="34" rx="5" fill="white" stroke="#9FD9CE" stroke-width="1.5"/>';
    svg += '<text x="' + t.x + '" y="' + (y8-5) + '" text-anchor="middle" font-size="9" fill="#aaa">' + t.label + '</text>';
    svg += '<text x="' + t.x + '" y="' + (y8+11) + '" text-anchor="middle" font-size="11" font-weight="700" fill="' + (isReal ? '#00695C' : '#b0b0b0') + '">' + esc(short) + '</text>';
  });

  // Q1–Q4 場次標籤（八強兩兩中間）
  var pairs4 = [[0,1],[2,3],[4,5],[6,7]];
  var q4x = pairs4.map(function(p) { return (q8[p[0]].x + q8[p[1]].x) / 2; });
  var yQLabel = y8 - 18 - 22; // 八強框上方
  pairs4.forEach(function(pair, i) {
    var mx = q4x[i];
    svg += '<rect x="' + (mx-18) + '" y="' + (yQLabel-12) + '" width="36" height="20" rx="4" fill="#E0F5F2" stroke="#00876f" stroke-width="1"/>';
    svg += '<text x="' + mx + '" y="' + (yQLabel+2) + '" text-anchor="middle" font-size="11" font-weight="700" fill="#00695C">Q' + (i+1) + '</text>';
    // 連線：從 Q label 往下到兩隊框頂
    svg += '<line x1="' + q8[pair[0]].x + '" y1="' + (y8-18) + '" x2="' + q8[pair[0]].x + '" y2="' + yQLabel + '" stroke="#9FD9CE" stroke-width="1.2"/>';
    svg += '<line x1="' + q8[pair[1]].x + '" y1="' + (y8-18) + '" x2="' + q8[pair[1]].x + '" y2="' + yQLabel + '" stroke="#9FD9CE" stroke-width="1.2"/>';
    svg += '<line x1="' + q8[pair[0]].x + '" y1="' + yQLabel + '" x2="' + q8[pair[1]].x + '" y2="' + yQLabel + '" stroke="#9FD9CE" stroke-width="1.2"/>';
    svg += '<line x1="' + mx + '" y1="' + (yQLabel-12) + '" x2="' + mx + '" y2="' + (y4+17) + '" stroke="#9FD9CE" stroke-width="1.2"/>';
  });

  // 準決賽框（Q勝者）
  var qLabels = ['Q1勝','Q2勝','Q3勝','Q4勝'];
  pairs4.forEach(function(pair, i) {
    var qw = teamOfMatch('Q' + (i+1), true);
    var lbl = qw || qLabels[i];
    var short = lbl.length > 6 ? lbl.slice(0,6)+'…' : lbl;
    var mx = q4x[i];
    svg += '<rect x="' + (mx-42) + '" y="' + (y4-17) + '" width="84" height="34" rx="5" fill="white" stroke="#00876f" stroke-width="1.5"/>';
    svg += '<text x="' + mx + '" y="' + (y4-4) + '" text-anchor="middle" font-size="9" fill="#aaa">Q' + (i+1) + '</text>';
    svg += '<text x="' + mx + '" y="' + (y4+12) + '" text-anchor="middle" font-size="11" font-weight="700" fill="' + (qw ? '#00695C' : '#b0b0b0') + '">' + esc(short) + '</text>';
  });

  // 四強（S1/S2）── 加場次標籤 + 對戰說明
  var pairs2 = [[0,1],[2,3]];
  var sfx = pairs2.map(function(p) { return (q4x[p[0]] + q4x[p[1]]) / 2; });
  var ySLabel = y4 - 17 - 22; // S1/S2 場次標籤位置（在 Q 勝者框上方）

  pairs2.forEach(function(pair, i) {
    var xa = q4x[pair[0]], xb = q4x[pair[1]], mx = sfx[i];
    // Q勝者框 → S場次標籤的連線
    svg += '<line x1="' + xa + '" y1="' + (y4-17) + '" x2="' + xa + '" y2="' + ySLabel + '" stroke="#9FD9CE" stroke-width="1.2"/>';
    svg += '<line x1="' + xb + '" y1="' + (y4-17) + '" x2="' + xb + '" y2="' + ySLabel + '" stroke="#9FD9CE" stroke-width="1.2"/>';
    svg += '<line x1="' + xa + '" y1="' + ySLabel + '" x2="' + xb + '" y2="' + ySLabel + '" stroke="#9FD9CE" stroke-width="1.2"/>';
    // S1/S2 場次標籤（綠色，類似 Q1–Q4）
    svg += '<rect x="' + (mx-18) + '" y="' + (ySLabel-12) + '" width="36" height="20" rx="4" fill="#E0F5F2" stroke="#00876f" stroke-width="1"/>';
    svg += '<text x="' + mx + '" y="' + (ySLabel+2) + '" text-anchor="middle" font-size="11" font-weight="700" fill="#00695C">' + (i===0?'S1':'S2') + '</text>';
    // S 場次標籤 → S結果框的連線
    svg += '<line x1="' + mx + '" y1="' + (ySLabel-12) + '" x2="' + mx + '" y2="' + (yS+17) + '" stroke="#9FD9CE" stroke-width="1.2"/>';
    // S1/S2 結果框（「S1勝」/ 「S2勝」進決賽）
    svg += '<rect x="' + (mx-42) + '" y="' + (yS-17) + '" width="84" height="34" rx="5" fill="white" stroke="#F47920" stroke-width="1.5"/>';
    svg += '<text x="' + mx + '" y="' + (yS-4) + '" text-anchor="middle" font-size="9" fill="#aaa">' + (i===0?'S1勝 → 決賽':'S2勝 → 決賽') + '</text>';
    var sw = teamOfMatch(i===0?'S1':'S2', true);
    var sLbl = sw || (i===0?'S1勝':'S2勝');
    var sShort = sLbl.length > 6 ? sLbl.slice(0,6)+'…' : sLbl;
    svg += '<text x="' + mx + '" y="' + (yS+12) + '" text-anchor="middle" font-size="11" font-weight="700" fill="#c4601a">' + esc(sShort) + '</text>';
  });

  // 季軍賽框（S1敗 vs S2敗，連到兩側）
  var bronze_x = W/2;
  svg += '<line x1="' + (sfx[0]+42) + '" y1="' + yS + '" x2="' + (bronze_x-46) + '" y2="' + yS + '" stroke="#F47920" stroke-width="1.2" stroke-dasharray="5,3"/>';
  svg += '<line x1="' + (bronze_x+46) + '" y1="' + yS + '" x2="' + (sfx[1]-42) + '" y2="' + yS + '" stroke="#F47920" stroke-width="1.2" stroke-dasharray="5,3"/>';
  svg += '<rect x="' + (bronze_x-46) + '" y="' + (yS-17) + '" width="92" height="34" rx="5" fill="#fff0e6" stroke="#F47920" stroke-width="1.5"/>';
  svg += '<text x="' + bronze_x + '" y="' + (yS-4) + '" text-anchor="middle" font-size="9" fill="#c4601a">S1敗 vs S2敗</text>';
  svg += '<text x="' + bronze_x + '" y="' + (yS+12) + '" text-anchor="middle" font-size="11" font-weight="700" fill="#c4601a">🥉 季軍賽</text>';

  // 決賽
  var fx = W/2;
  svg += '<line x1="' + sfx[0] + '" y1="' + (yS-17) + '" x2="' + sfx[0] + '" y2="' + (yF+22) + '" stroke="#9FD9CE" stroke-width="1.2"/>';
  svg += '<line x1="' + sfx[1] + '" y1="' + (yS-17) + '" x2="' + sfx[1] + '" y2="' + (yF+22) + '" stroke="#9FD9CE" stroke-width="1.2"/>';
  svg += '<line x1="' + sfx[0] + '" y1="' + (yF+22) + '" x2="' + sfx[1] + '" y2="' + (yF+22) + '" stroke="#9FD9CE" stroke-width="1.2"/>';
  svg += '<rect x="' + (fx-50) + '" y="' + (yF-20) + '" width="100" height="42" rx="8" fill="#00695C"/>';
  svg += '<text x="' + fx + '" y="' + (yF-5) + '" text-anchor="middle" font-size="11" fill="white">🏆 決賽</text>';
  svg += '<text x="' + fx + '" y="' + (yF+14) + '" text-anchor="middle" font-size="12" font-weight="700" fill="white">冠亞軍</text>';

  svg += '</svg>';
  return svg;
}

// ── Utils ──
function esc(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function fmtDate(d){if(!d)return '';const s=String(d);if(s.includes('T')||s.includes('-')){const dt=new Date(s);if(!isNaN(dt))return(dt.getMonth()+1)+'/'+dt.getDate();}return s;}
// 依真正的日期先後排序，避免 9/12 被字串排序排到 9/2 前面。支援 9/2、9月2日、2026-09-02。
function dateSortKey(d){if(!d)return Infinity;const s=String(d).trim();let mo=0,day=0,mt;if((mt=s.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*日/))){mo=+mt[1];day=+mt[2];}else if((mt=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))){mo=+mt[2];day=+mt[3];}else if((mt=s.match(/^(\d{1,2})\/(\d{1,2})/))){mo=+mt[1];day=+mt[2];}else{const dt=new Date(s);if(!isNaN(dt)){mo=dt.getMonth()+1;day=dt.getDate();}else return Infinity;}return mo*100+day;}
function sortDateKeys(keys){return [...keys].sort((a,b)=>dateSortKey(a)-dateSortKey(b));}
function fmtTime(t){if(!t)return '';const s=String(t);if(s.includes('GMT')||s.includes('1899')||s.includes('T')){const d=new Date(s);if(!isNaN(d))return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}return s;}
// ── 每 5 分鐘自動刷新比分 ──
async function refreshScores() {
  try {
    const mRes = await api({ action:'getMatches' });
    if (mRes.ok && mRes.data) {
      matchData = mRes.data;
      renderBracket();
      renderScheduleTab();
      const ov = document.getElementById('game-modal');
      if (ov && ov.classList.contains('open') && currentModalNum) openGameModal(currentModalNum);
    }
  } catch(e) {}
}
setInterval(() => { if (!document.hidden) refreshScores(); }, 300000);  // 每 5 分鐘刷新
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshScores(); });

function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.className='toast show';setTimeout(()=>e.className='toast',2500);}
</script>
